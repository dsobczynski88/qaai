changelog: Dropped the redundant raw `requirements` and `test_cases` fields from the payload — requirement_reviews already embeds req_id/text plus the M1-M5 mandatory_findings (verdict/rationale/cited_test_case_ids) that represent the same verification-depth evidence. Rewrote "What you receive", "Evaluation strategy", the H5 Yes/No criteria, and the cited_test_case_ids output rule to reason from those findings instead of raw test descriptions.
