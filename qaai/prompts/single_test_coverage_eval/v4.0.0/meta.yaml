changelog: |
  No-decomposition variant. Removes all decomposed_spec references: the coverage
  axis now judges the test case directly against the original requirement text
  (inputs: test_case + requirement), emitting one SpecAnalysis per requirement
  with spec_id set to req_id. Used by the test_case_reviewer_v3 prompt set when
  "Include requirement decomposition analysis" is toggled off.
