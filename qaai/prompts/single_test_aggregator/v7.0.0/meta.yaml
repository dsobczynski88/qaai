changelog: |
  No-decomposition variant. Removes the decomposed_requirements input and all
  per-spec language: the test case is reviewed directly against the original
  requirement text. coverage_analysis is now one SpecAnalysis per requirement
  (spec_id == req_id). Retains the v6 mandatory/recommended overall_verdict
  roll-up. Used by the test_case_reviewer_v3 prompt set when "Include
  requirement decomposition analysis" is toggled off.
