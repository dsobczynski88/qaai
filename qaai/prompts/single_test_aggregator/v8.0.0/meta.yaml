output_pydantic_model: TestCaseAssessment
changelog: |
  Embedded-rubric variant of the decomposition aggregator (v6.0.0). The five
  review objectives (expected_result_support, expected_result_spec_align,
  test_case_achieves, test_case_logical_sequence — mandatory; test_case_setup_clarity
  — recommended) are now baked into the template rather than supplied via the
  `review_objectives` input. This brings the test_case_reviewer in line with the
  test_suite (M1-M5) and hazard (H1-H6) reviewers, which embed their rubrics in the
  prompt. Retains the v6 decomposed-spec reasoning, spec_id reframing, and
  mandatory/recommended overall_verdict roll-up. Output schema and verdict semantics
  are unchanged. Used by the test_case_reviewer_v2 prompt set (decomposition toggle ON).
