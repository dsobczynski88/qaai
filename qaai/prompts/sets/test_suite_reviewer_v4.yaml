name: test_suite_reviewer_v4
component: test_suite_reviewer
description: |
  Edge-case-analysis stack with design-aware coverage evaluation. Identical to
  test_suite_reviewer_v3 except coverage is bumped to v8.0.0, which threads the
  summarized_designs context into per-spec coverage evaluation as supporting
  evidence (verification_hooks, key_components) while keeping the guardrail that
  design intent never substitutes for explicit test-case coverage.
  Uses decomposer v6, summarizer v4, coverage v8, synthesizer v7, design_summarizer v1.
prompts:
  decomposer: v6.0.0
  summarizer: v4.0.0
  coverage: v8.0.0
  synthesizer: v8.0.0
  design_summarizer: v1.0.0
status: experimental
authored: "2026-06-06"
parent_set: test_suite_reviewer_v3
