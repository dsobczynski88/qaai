# Eval spec — Single Test Case Reviewer. 5 review objectives (Yes/No): the first four
# mandatory, test_case_setup_clarity advisory.
# Objective ids are stable and embedded in the aggregator prompt.
name: test_case_reviewer
component: test_case_reviewer
prompt_set: test_case_reviewer_v2            # v2 decomposes; v3 skips decomposition

input:
  test_case: test_case
  requirements: requirements
  design_docs: design_docs

output:
  verdict_path: aggregated_assessment.overall_verdict
  rubric:
    list_path: aggregated_assessment.evaluated_checklist
    code_field: id                            # objective id, not "code"
    verdict_field: verdict
    codes:
      - expected_result_support
      - expected_result_spec_align
      - test_case_achieves
      - test_case_logical_sequence
      - test_case_setup_clarity

labels:
  verdict_key: Overall_Verdict
  rubric_keys:
    - expected_result_support
    - expected_result_spec_align
    - test_case_achieves
    - test_case_logical_sequence
    - test_case_setup_clarity

scoring:
  positive_label: "Yes"
  negative_label: "No"
  na_label: "N-A"                              # TC objectives are Yes/No; N-A unused
  # test_case_setup_clarity is recommended-only, mirroring R6 / R7 in the other two
  # reviewers. This is not a policy choice made here: every shipping aggregator prompt
  # (single_test_aggregator v6/v8/v9) fixes its `mandatory` flag to false and rolls up
  # overall_verdict across mandatory objectives only. v8+ embed the objective list, so
  # the flag is not even configurable at run time. Leaving this empty made the scorer
  # derive "No" on rows where the pipeline emits "Yes" — a silent, systematic accuracy
  # loss on exactly the rows where setup_clarity is the sole failing objective.
  advisory_codes: [test_case_setup_clarity]
  rubric_class_mode: multiclass

mlflow:
  experiment: test_case_reviewer
  # scoring_rev pins the metric semantics: 2 marks setup_clarity becoming advisory, so
  # runs scored under the old all-mandatory rule stay distinguishable in the UI.
  params: {scoring_rev: 2}
  tags: {}
  metrics_enabled: [overall, per_rubric, latency, cost, helper_invariant]
