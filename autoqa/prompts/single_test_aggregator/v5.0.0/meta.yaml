changelog: |
  Reframe expected_result_spec_align assessments in terms of original requirement 
  semantic aspects rather than AI-generated spec_ids. Specs are internal decomposition 
  artifacts, not part of the actual requirement. Assessments now describe which 
  behaviors/conditions from the requirement text are covered/missing, never citing 
  spec_ids as if they were official requirement elements.
