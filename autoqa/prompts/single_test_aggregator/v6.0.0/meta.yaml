changelog: |
  Introduce mandatory vs. recommended review objectives. The 'mandatory' field on each
  review_objective determines whether a "No" verdict affects overall_verdict. Recommended
  objectives (mandatory=false) are evaluated and displayed but do NOT gate overall_verdict.
  This mirrors the test_suite_reviewer's M1-M5 (mandatory) vs. R6 (recommended) pattern.
  By default, test_case_setup_clarity is now recommended-only.
