[project]
name = "qaai"
version = "1.0.0"
description = "Design Quality AI-Assisted DHF Reviewer - AI system for enhancing software quality review processes"
authors = [
    {name = "Daniel Sobczynski", email = "daniel_sobczynski@baxter.com"},
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "pydantic>=2.7",
  "langgraph>=1.0",
  "langchain-core>=1.2",
  "langchain-openai>=1.1",
  "langchain-ollama>=1.0",
  "matplotlib>=3.10.8",
  "openpyxl>=3.1.5",
  "python-dotenv>=1.2.2",
  "jinja2>=3.1.6",
  "langchain-aws>=1.4.0",
  "numpy>=2.4.2",
  "nest-asyncio>=1.6",
  "tqdm>=4.66",
  "fastapi[standard]>=0.115",
  "pydantic-settings>=2.0",
  "pyyaml>=6.0",
  "truststore>=0.10.4",
  "langchain>=1.2.17",
  "pytest>=9.0.2",
  "pyjama",
]

[project.optional-dependencies]
# AWS-only secret retrieval (EnvVariableRetriever, qaai/core/secrets.py). Not needed
# for local/CI; install on AWS deployments with: uv sync --extra aws
aws = ["boto3>=1.34"]

[dependency-groups]
dev = [
    "matplotlib>=3.10.8",
    "mlflow>=3.12.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "scikit-learn>=1.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that make real LLM API calls (deselect with -m 'not integration')",
]
testpaths = ["tests"]
python_classes = []

[tool.uv.sources]
# pyjama is vendored locally at libs/pyjama (a git subtree of pyjama-fastapi) and installed
# as an editable path dependency, so edits under libs/pyjama take effect without reinstall.
# Sync with the standalone repo via: scripts/pyjama_subtree.ps1 pull|push  (.sh on POSIX).
pyjama = { path = "libs/pyjama", editable = true }

[project.scripts]
qaai-api = "qaai.api.run:main"

# Declaring a build system allows uv to install your project editably during sync.
# This does not publish anything by itself; it just makes local imports work cleanly.
[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"
