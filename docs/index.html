<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QAAI · Documentation</title>
<!--
  QAAI docs shell. The docs themselves are Markdown (.md) files in this folder;
  this page fetches the one named by the URL hash, renders it to HTML with a
  vendored marked, and drops it into the themed <main>. Served statically at
  /guide/ (qaai/api/main.py). Routing: #/ = home.md, #/api = api.md,
  #/design/agents = design/agents.md, #/api#endpoints scrolls to a section.
  marked: v12.0.2 UMD, vendored at assets/marked.min.js
    (https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js).
  Security: .md are first-party, code-reviewed content and marked emits their
  raw inline HTML (.note/.pill/pre.diagram) verbatim — no sanitizer. If docs
  ever accept untrusted contributions, add DOMPurify around marked.parse().
-->
<style>
  :root{--bg:#fff;--ink:#1a1a1a;--mute:#5a6472;--line:#e3e6ea;--accent:#2b62c2;
    --code-bg:#f6f8fa;--sidebar:#fafbfc;--ok:#1b7f3b;--warn:#9a6700;--bad:#b22;--maxw:880px}
  @media(prefers-color-scheme:dark){:root{--bg:#0f1419;--ink:#e6e8eb;--mute:#9aa4b2;
    --line:#222a33;--accent:#6ea8ff;--code-bg:#161b22;--sidebar:#11161c;--ok:#5bd07e;--warn:#e3b341;--bad:#ff7b72}}
  *{box-sizing:border-box}html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  .layout{display:grid;grid-template-columns:274px 1fr;min-height:100vh}
  nav.toc{position:sticky;top:0;align-self:start;height:100vh;overflow:auto;padding:24px 18px;background:var(--sidebar);border-right:1px solid var(--line);font-size:14px}
  nav.toc .brand{display:block;font-size:15px;font-weight:600;color:var(--ink);text-decoration:none;margin:0 0 18px}
  nav.toc strong{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:14px 0 8px}
  nav.toc a{display:block;color:var(--mute);text-decoration:none;padding:3px 0}
  nav.toc a:hover,nav.toc a.active{color:var(--accent)}
  main{max-width:var(--maxw);padding:32px 30px 90px;margin:0 auto;width:100%}
  h1{margin:0 0 4px;line-height:1.2}
  h1,h2,h3{line-height:1.25;scroll-margin-top:14px}
  h2{margin-top:40px;border-bottom:1px solid var(--line);padding-bottom:6px}
  h3{margin-top:26px}
  a{color:var(--accent)}
  code{font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--code-bg);padding:1px 5px;border-radius:4px}
  pre{background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:14px;overflow:auto}
  pre code{background:none;padding:0}
  pre.diagram{line-height:1.35}
  table{border-collapse:collapse;width:100%;font-size:14px;margin:12px 0}
  th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
  th{background:var(--code-bg)}
  img{max-width:100%}
  figure{margin:16px 0}figcaption{color:var(--mute);font-size:13px;margin-top:6px}
  .meta{color:var(--mute);font-size:13px;margin-bottom:8px}
  .src{color:var(--mute);font:12px ui-monospace,monospace}
  .pill{display:inline-block;font:12px ui-monospace,monospace;padding:1px 7px;border-radius:999px;border:1px solid var(--line)}
  .get{color:var(--ok)}.post{color:var(--accent)}
  .note{border-left:3px solid var(--accent);background:var(--code-bg);padding:10px 14px;border-radius:0 6px 6px 0;margin:14px 0}
  .note.warn,.warn{border-left-color:var(--warn)}
  .cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));margin-top:20px}
  .card{display:block;border:1px solid var(--line);border-radius:10px;padding:16px 18px;text-decoration:none;transition:border-color .15s,transform .15s}
  .card:hover{border-color:var(--accent);transform:translateY(-1px)}
  .card h2{margin:0 0 4px;border:none;padding:0;font-size:16px;color:var(--accent)}
  .card p{margin:0;color:var(--mute);font-size:14px}
  footer.doc{margin-top:48px;padding-top:14px;border-top:1px solid var(--line);color:var(--mute);font-size:13px}
  @media(max-width:760px){.layout{grid-template-columns:1fr}nav.toc{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line)}th,td{overflow-wrap:anywhere}}
  @media print{nav.toc{display:none}.layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="layout">
  <nav class="toc" aria-label="Table of contents"></nav>
  <main id="doc"></main>
</div>
<script src="assets/marked.min.js"></script>
<script>
  // ── Doc registry: the sidebar's persistent list + the source of document.title. ──
  const NAV = [
    {group:"Documentation", items:[
      {route:"api",            title:"API Server & Frontend Guide"},
      {route:"configuration",  title:"Configuration Guide"},
      {route:"review_options", title:"Review Options & Toggles"},
      {route:"test_guide",     title:"Test Guide"},
      {route:"mlflow",         title:"MLflow Evaluation"},
      {route:"test_catalog",   title:"Test Catalog"},
    ]},
    {group:"Design", items:[
      {route:"design/agents",               title:"Reviewer Agents (overview)"},
      {route:"design/caching",              title:"Caching"},
      {route:"design/test_suite_reviewer",  title:"Test Suite Reviewer (RTM)"},
      {route:"design/test_case_reviewer",   title:"Test Case Reviewer"},
      {route:"design/hazard_risk_reviewer", title:"Hazard Risk Reviewer"},
      {route:"design/prompt_design",        title:"Prompt Design"},
      {route:"design/frontend_vue_rbac",    title:"Frontend (Vue 3) & RBAC"},
    ]},
  ];
  const TITLES = {"": "Documentation"};
  NAV.forEach(g => g.items.forEach(i => { TITLES[i.route] = i.title; }));

  const main = document.getElementById("doc");
  const nav  = document.querySelector("nav.toc");
  let currentDoc = null;   // route of the doc currently rendered (null = none yet)
  let currentObs = null;   // active-heading IntersectionObserver, rewired per doc

  // ── Hash parsing: split "which doc" from "which section". ──
  // location.hash "#/api#endpoints" -> {docPath:"api", section:"endpoints"};
  // "#/" or "" -> {docPath:"", section:""} (home).
  function parseHash(){
    let h = location.hash.replace(/^#/, "").replace(/^\//, "");
    const i = h.indexOf("#");
    if (i >= 0) return {docPath: h.slice(0, i), section: h.slice(i + 1)};
    return {docPath: h, section: ""};
  }

  const slug = t => t.toLowerCase().trim().replace(/[^\w\s-]/g, "").replace(/\s+/g, "-");

  function assignHeadingIds(root){
    root.querySelectorAll("h2,h3").forEach(h => { if (!h.id) h.id = slug(h.textContent); });
  }

  // Relative images resolve against the shell (/guide/), not the .md's folder, so
  // rewrite "img/x.png" in design/foo.md -> "design/img/x.png".
  function rewriteImages(root, docDir){
    root.querySelectorAll("img").forEach(img => {
      const src = img.getAttribute("src") || "";
      if (!/^(https?:|\/|data:)/i.test(src)) img.setAttribute("src", docDir + src);
    });
  }

  // Turn the docs' .html/.md cross-links (and same-page anchors) into #/ routes so
  // the hashchange listener handles clicks — middle-click / open-in-new-tab still work.
  function rewriteLinks(root, docPath, docDir){
    root.querySelectorAll("a[href]").forEach(a => {
      const href = a.getAttribute("href") || "";
      if (/^(https?:|mailto:)/i.test(href)) { a.target = "_blank"; a.rel = "noopener"; return; }
      if (href.startsWith("#/")) return;                                   // already a route
      if (href.startsWith("#")) { a.setAttribute("href", "#/" + docPath + href); return; } // same-page anchor
      if (/\.(html|md)(#.*)?$/i.test(href)) {                             // inter-doc link
        const u = new URL(href, "file:///" + docDir);
        let path = u.pathname.replace(/^\//, "").replace(/\.(html|md)$/i, "");
        if (path === "index") path = "";
        a.setAttribute("href", "#/" + path + (u.hash || ""));
      }
    });
  }

  function buildSidebar(activeDoc){
    let html = '<a class="brand" href="#/">QAAI Documentation</a>';
    for (const grp of NAV) {
      html += "<strong>" + grp.group + "</strong>";
      for (const it of grp.items) {
        const cls = it.route === activeDoc ? ' class="active"' : "";
        html += '<a href="#/' + it.route + '"' + cls + ">" + it.title + "</a>";
      }
    }
    // In-page TOC (skip on home, where the h2s are just the hub cards).
    if (activeDoc !== "") {
      const heads = [...main.querySelectorAll("h2,h3")];
      if (heads.length) {
        html += '<strong>On this page</strong>';
        for (const h of heads) {
          const pad = h.tagName === "H3" ? ' style="padding-left:12px"' : "";
          html += '<a href="#/' + activeDoc + "#" + h.id + '" data-tocid="' + h.id + '"' + pad + ">"
                + h.textContent + "</a>";
        }
      }
    }
    nav.innerHTML = html;
  }

  function wireObserver(){
    if (currentObs) currentObs.disconnect();
    const tocLinks = [...nav.querySelectorAll("a[data-tocid]")];
    if (!tocLinks.length) { currentObs = null; return; }
    const byId = new Map(tocLinks.map(a => [a.getAttribute("data-tocid"), a]));
    currentObs = new IntersectionObserver(es => { es.forEach(e => { if (e.isIntersecting) {
      tocLinks.forEach(l => l.classList.remove("active"));
      const a = byId.get(e.target.id); if (a) a.classList.add("active");
    }}); }, {rootMargin: "-10% 0px -80% 0px"});
    main.querySelectorAll("[id]").forEach(s => currentObs.observe(s));
  }

  function scrollToSection(section){
    if (section) { const el = document.getElementById(section); if (el) { el.scrollIntoView(); return; } }
    window.scrollTo(0, 0);
  }

  async function render(){
    const {docPath, section} = parseHash();

    // Same doc, only the section changed → just scroll (no re-fetch / re-render).
    if (docPath === currentDoc && main.dataset.loaded === "1") { scrollToSection(section); return; }

    const mdPath = docPath === "" ? "home.md" : docPath + ".md";
    let res = null;
    try { res = await fetch(mdPath); } catch (e) { /* offline / bad path */ }
    if (!res || !res.ok) {
      main.innerHTML = "<h1>Not found</h1><p>No document at <code>" + mdPath
                     + '</code>. <a href="#/">Back to docs home</a>.</p>';
      buildSidebar(docPath);
      document.title = "QAAI · Docs";
      currentDoc = null; main.dataset.loaded = "0";
      return;
    }

    main.innerHTML = marked.parse(await res.text());
    const docDir = docPath.includes("/") ? docPath.slice(0, docPath.lastIndexOf("/") + 1) : "";
    rewriteImages(main, docDir);
    rewriteLinks(main, docPath, docDir);
    assignHeadingIds(main);
    buildSidebar(docPath);
    wireObserver();
    document.title = "QAAI · " + (TITLES[docPath] || (main.querySelector("h1")?.textContent ?? "Docs"));
    currentDoc = docPath; main.dataset.loaded = "1";
    scrollToSection(section);
  }

  window.addEventListener("hashchange", render);
  render();
</script>
</body>
</html>
