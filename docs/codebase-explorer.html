role": "EvalSpec — declarative where-does-the-prediction-live schema", "explanation": "A YAML-loaded EvalSpec declares, per reviewer, the dotted path to the overall verdict and rubric cells in a graph-output row and how to read gold labels, so the scorer never hard-codes a schema. Extraction reads from both plain dicts (score-only) and Pydantic models (run+score).", "python_analogy": "A config-as-schema object — like a JSON-path spec that tells a generic scorer where to find y_pred and y_true.", "key_snippet": {"start": 111, "end": 128, "code": "    def extract_prediction(self, out_row: Any) -> tuple[Optional[str], Dict[str, Any]]:\n        \"\"\"Pull (overall_verdict, {code: verdict}) from an output/state row.\"\"\"\n        verdict = get_path(out_row, self.output.verdict_path)\n        rubric: Dict[str, Any] = {}\n        if self.output.rubric:\n            items = get_path(out_row, self.output.rubric.list_path) or []\n            for item in items:\n                code = _get(item, self.output.rubric.code_field)\n                if code is not None:\n                    rubric[str(code)] = _get(item, self.output.rubric.verdict_field)\n        return verdict, rubric\n\n    def extract_label(self, label_row: Dict[str, Any]) -> tuple[Optional[str], Dict[str, Any]]:\n        \"\"\"Pull (overall_verdict, {code: verdict}) from a flat labels row.\"\"\"\n        verdict = label_row.get(self.labels.verdict_key)\n        keys = self.labels.rubric_keys or (self.output.rubric.codes if self.output.rubric else [])\n        rubric = {k: label_row[k] for k in keys if k in label_row}\n        return verdict, rubric"}, "imports": [], "imported_by": ["qaai/eval/scoring.py", "qaai/eval/datasets.py", "qaai/eval/harness.py", "qaai/eval/mlflow_run.py"]}, {"path": "qaai/eval/scoring.py", "language": "python", "role": "Pure classifier scoring (overall + per-rubric, sklearn metrics)", "explanation": "Pairs each output row with its label into RecordResults, then computes overall binary metrics (accuracy/precision/recall/F1 + confusion), per-rubric multiclass macro-F1, a helper-invariant pass rate (predicted verdict vs the deterministic rule), and a skip rate. All pure/LLM-free, so unit-testable.", "python_analogy": "A metrics module built on sklearn.metrics — like turning predictions and labels into a scikit-learn classification report.", "key_snippet": {"start": 135, "end": 162, "code": "def compute_metrics(spec: EvalSpec, records: List[RecordResult]) -> Dict[str, Any]:\n    \"\"\"Reduce RecordResults to a nested metrics dict (see metrics.py for the flat MLflow view).\"\"\"\n    enabled = set(spec.mlflow.metrics_enabled)\n    total = len(records)\n    scored = [r for r in records if r.scored]\n    out: Dict[str, Any] = {\n        \"n_total\": total,\n        \"n_scored\": len(scored),\n        \"skip_rate\": (total - len(scored)) / total if total else 0.0,\n    }\n\n    # --- Overall binary classifier ---\n    if \"overall\" in enabled and scored:\n        y_true = [r.gt_overall for r in scored]\n        y_pred = [r.pred_overall for r in scored]\n        pos = spec.scoring.positive_label\n        yt, yp = _binary(y_true, pos), _binary(y_pred, pos)\n        prec, rec, f1, _ = precision_recall_fscore_support(\n            yt, yp, average=\"binary\", pos_label=1, zero_division=0\n        )\n        out[\"overall\"] = {\n            \"accuracy\": float(accuracy_score(y_true, y_pred)),\n            \"precision\": float(prec),\n            \"recall\": float(rec),\n            \"f1\": float(f1),\n            \"support_positive\": int(sum(yt)),\n            \"support_negative\": int(len(yt) - sum(yt)),\n        }"}, "imports": ["qaai/eval/spec.py"], "imported_by": ["qaai/eval/harness.py", "qaai/eval/artifacts.py", "qaai/eval/__init__.py"]}, {"path": "qaai/eval/metrics.py", "language": "python", "role": "Flatten nested scores into a flat MLflow metrics dict", "explanation": "flatten_metrics() turns compute_metrics() output into scalar keys (overall_*, rubric_accuracy.<code>, rubric_f1.<code>, latency percentiles, cost) suitable for mlflow.log_metrics.", "python_analogy": "A small mapper from a nested dict to a flat {key: float} — like flattening JSON for a metrics sink.", "key_snippet": {"start": 12, "end": 34, "code": "def flatten_metrics(nested: Dict[str, Any], cost: Optional[Dict[str, float]] = None) -> Dict[str, float]:\n    \"\"\"Turn compute_metrics() output into flat scalar metrics for MLflow.\"\"\"\n    flat: Dict[str, float] = {}\n\n    for k in (\"n_total\", \"n_scored\", \"skip_rate\"):\n        if k in nested:\n            flat[k] = float(nested[k])\n\n    overall = nested.get(\"overall\")\n    if overall:\n        for k, v in overall.items():\n            flat[f\"overall_{k}\"] = float(v)\n\n    per_rubric = nested.get(\"per_rubric\")\n    if per_rubric:\n        for code, cell in per_rubric.items():\n            flat[f\"rubric_accuracy.{code}\"] = float(cell[\"accuracy\"])\n            flat[f\"rubric_f1.{code}\"] = float(cell[\"f1_macro\"])\n\n    if \"rubric_macro_f1\" in nested:\n        flat[\"rubric_macro_f1\"] = float(nested[\"rubric_macro_f1\"])\n    if \"helper_invariant_pass_rate\" in nested:\n        flat[\"helper_invariant_pass_rate\"] = float(nested[\"helper_invariant_pass_rate\"])"}, "imports": [], "imported_by": ["qaai/eval/harness.py"]}, {"path": "qaai/eval/sample_size.py", "language": "python", "role": "Sample-size / confidence-interval math (stdlib only)", "explanation": "Sizes the labelled set needed to pin one reviewer's accuracy to a target CI (normal/Wald and Wilson methods, with a finite-population correction) and inverts to report the achieved margin for a given N — using only statistics.NormalDist, no scipy.", "python_analogy": "A stats helper — the kind of power-analysis function you'd otherwise reach for scipy.stats for, done with the standard library.", "key_snippet": {"start": 35, "end": 42, "code": "def n_normal(confidence: float, margin: float, p: float = 0.5, population: Optional[int] = None) -> int:\n    \"\"\"Required N via the normal (Wald) approximation: n = z²·p(1−p)/m².\"\"\"\n    if not 0.0 < margin < 1.0:\n        raise ValueError(\"margin must be in (0, 1)\")\n    z = z_for_confidence(confidence)\n    n = (z ** 2 * p * (1.0 - p)) / (margin ** 2)\n    return _apply_fpc(math.ceil(n), population)\n"}, "imports": [], "imported_by": []}, {"path": "qaai/eval/datasets.py", "language": "python", "role": "Load/convert the row-aligned three-file eval dataset", "explanation": "Loads eval_inputs/eval_outputs/eval_outputs_labels JSONL (positionally aligned), and converts gold_dataset_labeled.jsonl into inputs+labels, synthesizes oracle outputs from labels (for offline CI), or passes a live run's outputs.jsonl straight through.", "python_analogy": "A dataset loader/converter — like a small torch Dataset wrapper that reads JSONL files and reshapes them.", "key_snippet": {"start": 66, "end": 90, "code": "def load_dataset(\n    dataset_dir: Optional[Union[str, Path]] = None,\n    *,\n    mode: str = \"score\",\n    inputs_path: Optional[Union[str, Path]] = None,\n    outputs_path: Optional[Union[str, Path]] = None,\n    labels_path: Optional[Union[str, Path]] = None,\n) -> EvalDataset:\n    \"\"\"Load a dataset from a directory or explicit per-file paths.\n\n    ``mode='score'`` requires outputs + labels; ``mode='run'`` requires inputs + labels.\n    Missing optional files load as empty lists.\n    \"\"\"\n    d = Path(dataset_dir) if dataset_dir else None\n    ip = Path(inputs_path) if inputs_path else (d / INPUTS_NAME if d else None)\n    op = Path(outputs_path) if outputs_path else (d / OUTPUTS_NAME if d else None)\n    lp = Path(labels_path) if labels_path else (d / LABELS_NAME if d else None)\n\n    labels = load_jsonl(lp) if lp and lp.exists() else []\n    inputs = load_jsonl(ip) if ip and ip.exists() else []\n    outputs = load_jsonl(op) if op and op.exists() else []\n\n    if not labels:\n        raise FileNotFoundError(f\"labels file not found or empty: {lp}\")\n    if mode == \"score\" and not outputs:"}, "imports": ["qaai/eval/spec.py"], "imported_by": ["qaai/eval/harness.py", "qaai/eval/mlflow_run.py"]}, {"path": "qaai/eval/artifacts.py", "language": "python", "role": "Write per-run MLflow artifacts (predictions, confusion matrix, …)", "explanation": "write_all() emits the inspection surface into the MLflow run dir: predictions.jsonl, failures.jsonl, per_rubric.csv, a confusion-matrix PNG (matplotlib Agg), prompt-version provenance, and fixture metadata with the label distribution.", "python_analogy": "An artifact writer — like a reporting step that dumps CSV/PNG/JSON side-effects for a run.", "key_snippet": {"start": 110, "end": 126, "code": "def write_all(\n    run_dir: Path,\n    spec: EvalSpec,\n    records: List[RecordResult],\n    nested_metrics: Dict[str, Any],\n    provenance: Dict[str, Any],\n    fixture_meta: Dict[str, Any],\n) -> Path:\n    \"\"\"Write every artifact into ``run_dir`` and return it (ready for mlflow.log_artifacts).\"\"\"\n    run_dir.mkdir(parents=True, exist_ok=True)\n    write_predictions(run_dir, records)\n    write_failures(run_dir, records)\n    write_per_rubric_csv(run_dir, nested_metrics)\n    write_confusion_matrix(run_dir, spec, records)\n    write_prompt_versions(run_dir, provenance)\n    write_fixture_metadata(run_dir, spec, records, fixture_meta)\n    return run_dir"}, "imports": ["qaai/eval/scoring.py", "qaai/eval/spec.py"], "imported_by": ["qaai/eval/harness.py"]}, {"path": "qaai/eval/mlflow_run.py", "language": "python", "role": "MLflow run scaffolding (params, tags, prompt provenance, tracing)", "explanation": "Builds the reproducibility param catalogue (git sha/dirty, model, prompt-set versions + manifest sha256, fixture sha256), experiment naming, tags, and enable_tracing() for LangChain autologging. Prompt provenance is pulled from the versioned registry rather than hashing flat files.", "python_analogy": "A helper that assembles the metadata you log alongside an experiment run — like the params/tags block for an MLflow or W&B run.", "key_snippet": {"start": 31, "end": 51, "code": "def prompt_provenance(prompt_set: Optional[str]) -> Dict[str, Any]:\n    \"\"\"Resolve a prompt set to {set, manifest_sha256, prompts:{role:{version,sha256}}}.\n\n    Sourced from qaai.prompts._registry.load_set so it tracks the versioned template\n    registry exactly (fixes the legacy flat-file hashing that drifted).\n    \"\"\"\n    if not prompt_set:\n        return {\"set\": \"default\"}\n    from qaai.prompts._registry import load_set\n\n    rs = load_set(prompt_set)\n    return {\n        \"set\": rs.name,\n        \"component\": rs.component,\n        \"status\": rs.status,\n        \"manifest_sha256\": rs.manifest_sha256,\n        \"prompts\": {\n            role: {\"version\": p.version, \"sha256\": file_sha256(p.template_path)}\n            for role, p in rs.prompts.items()\n        },\n    }"}, "imports": ["qaai/eval/datasets.py", "qaai/eval/spec.py", "qaai/prompts/_registry.py"], "imported_by": ["qaai/eval/harness.py"]}, {"path": "qaai/eval/runners.py", "language": "python", "role": "Component registry + live run-and-score execution", "explanation": "Maps spec.component to the compiled reviewer runnable, a row→graph-input builder (mirrors the API services), and the completeness predicate. run_and_collect() invokes the graph on every input row with bounded concurrency (a semaphore over asyncio.gather), soft-failing individual rows. Heavy imports are lazy so score-only mode never pays for them.", "python_analogy": "A dispatch table + concurrent executor — like a registry dict of {name: builder} plus an asyncio.gather with a Semaphore cap.", "key_snippet": {"start": 131, "end": 149, "code": "    sem = asyncio.Semaphore(max_concurrent)\n\n    async def run_one(i: int, row: Dict[str, Any]):\n        async with sem:\n            t0 = time.perf_counter()\n            try:\n                state = comp.build_input(row, cache_mode)\n                out = await runnable.graph.ainvoke(state, {\"configurable\": {\"thread_id\": f\"eval-{i:04d}\"}})\n                return i, out, time.perf_counter() - t0, bool(is_complete(out)), None\n            except Exception as e:  # soft-fail one record, keep the batch alive\n                return i, None, time.perf_counter() - t0, False, repr(e)\n\n    results = await asyncio.gather(*(run_one(i, row) for i, row in enumerate(inputs)))\n    results.sort(key=lambda x: x[0])\n    outputs = [r[1] for r in results]\n    latencies = [r[2] for r in results]\n    completes = [r[3] for r in results]\n    errors = [r[4] for r in results]\n    return outputs, latencies, completes, errors"}, "imports": ["qaai/agents/clients.py", "qaai/agents/test_suite_reviewer/pipeline.py", "qaai/agents/test_case_reviewer/pipeline.py", "qaai/agents/hazard_risk_reviewer/pipeline.py", "qaai/api/services.py", "qaai/core/config.py"], "imported_by": ["qaai/eval/harness.py"]}, {"path": "qaai/eval/harness.py", "language": "python", "role": "End-to-end eval orchestrator (load → run|score → score → log MLflow)", "explanation": "evaluate() ties the package together: gather outputs (freshly produced via runners in 'run' mode, or read from the dataset in 'score' mode), build RecordResults, compute + flatten metrics, and log one MLflow run with params/tags/metrics and the full artifact set. Returns a small summary dict for the CLI.", "python_analogy": "The top-level train/eval loop — like a main() that wires dataset + model + scorer + experiment tracker together.", "key_snippet": {"start": 40, "end": 63, "code": "def evaluate(\n    spec: EvalSpec,\n    dataset: EvalDataset,\n    *,\n    mode: str,\n    run_name: Optional[str] = None,\n    experiment: Optional[str] = None,\n    prompt_set: Optional[str] = None,\n    max_concurrent: int = 10,\n    limit: Optional[int] = None,\n    allow_prod: bool = False,\n    trace: bool = True,\n    tracking_uri: Optional[str] = None,\n) -> Dict[str, Any]:\n    \"\"\"Run one evaluation study and log it as a single MLflow run.\n\n    ``mode='score'`` scores pre-computed eval_outputs (no LLM). ``mode='run'`` invokes\n    the graph on eval_inputs first. Returns a small summary dict for the CLI.\n    \"\"\"\n    import mlflow\n\n    prompt_set = prompt_set or spec.prompt_set\n    provenance = mr.prompt_provenance(prompt_set)\n"}, "imports": ["qaai/eval/artifacts.py", "qaai/eval/datasets.py", "qaai/eval/metrics.py", "qaai/eval/scoring.py", "qaai/eval/spec.py", "qaai/eval/mlflow_run.py", "qaai/eval/runners.py"], "imported_by": []}, {"path": "qaai/viewer/common/shared.js", "language": "javascript", "role": "Shared viewer runtime (nav, modal, feedback, run-log, missing-fields)", "explanation": "Concatenated ahead of each reviewer's script.js. Provides escapeHTML, the rating/notes save() to localStorage, renderRight()/render(), the modal open/close, initViewer() nav wiring + feedback export, the 'View log' problem-note modal, and the missing-required-fields warning banner. Each reviewer supplies renderLeft() and feedbackKey().", "python_analogy": "A shared JS module of DOM helpers loaded before each page-specific script — like a common.js of utilities the per-page scripts depend on.", "key_snippet": {"start": 36, "end": 51, "code": "function renderRight() {\n  const rec = RECORDS[idx];\n  const key = (typeof feedbackKey === \"function\" ? feedbackKey(rec, idx) : null) || `rec-${idx}`;\n  const saved = feedback[key] || {};\n  document.getElementById(\"notes\").value = saved.notes || \"\";\n  document.querySelectorAll('input[name=\"rating\"]').forEach(el => el.checked = false);\n  if (saved.rating) {\n    const el = document.querySelector(`input[name=\"rating\"][value=\"${saved.rating}\"]`);\n    if (el) el.checked = true;\n  }\n  document.getElementById(\"progress\").textContent = `Progress: ${idx+1} / ${RECORDS.length}`;\n  document.getElementById(\"prev-btn\").disabled = idx === 0;\n  document.getElementById(\"next-btn\").textContent = idx === RECORDS.length - 1 ? \"Save\" : \"Save & Next\";\n}\n\nfunction render() { renderLeft(); renderRight(); }"}, "imports": [], "imported_by": ["qaai/viewer/test_suite_reviewer/script.js", "qaai/viewer/test_case_reviewer/script.js", "qaai/viewer/hazard_reviewer/script.js"]}, {"path": "qaai/viewer/test_suite_reviewer/script.js", "language": "javascript", "role": "RTM viewer left-pane render + spec/TC/help modals", "explanation": "Defines renderLeft() for one RTMReviewState record (requirement, test cases, the M1–M5+R6 findings table with Yellow partial rendering) plus openTC/openSpecs/openCriteriaHelp modals and feedbackKey (req_id). Calls initViewer() from shared.js at the end.", "python_analogy": "A page controller that builds innerHTML from a record — like a vanilla-JS view that templates a DOM string from a data object.", "key_snippet": {"start": 91, "end": 117, "code": "function openSpecs() {\n  const rec = RECORDS[idx];\n  const specs = rec.decomposed_requirement?.decomposed_specifications ?? [];\n  const analysis = rec.coverage_analysis ?? [];\n  const byId = Object.fromEntries(analysis.map(a => [a.spec_id, a]));\n  const rows = specs.map(s => {\n    const a = byId[s.spec_id];\n    const covered = !!a?.covered_exists;\n    const cls = covered ? \"covered\" : \"uncovered\";\n    const tcs = (a?.covered_by_test_cases ?? []).map(ctc =>\n      `<div><span class=\"cited\">${escapeHTML(ctc.test_case_id)}<\/span> ${(ctc.dimensions ?? []).map(d => `<span class=\"dim-chip\">${escapeHTML(d)}<\/span>`).join(\"\")}<div style=\"font-size:12px;color:var(--mute)\">${escapeHTML(ctc.rationale ?? \"\")}<\/div><\/div>`\n    ).join(\"\") || \"<em>(no covering TCs)<\/em>\";\n    return `<tr class=\"${cls}\">\n      <td><strong>${escapeHTML(s.spec_id)}<\/strong><\/td>\n      <td>${escapeHTML(s.description)}<\/td>\n      <td>${escapeHTML(s.acceptance_criteria)}<\/td>\n      <td>${covered ? \"✓ covered\" : \"✗ not covered\"}<\/td>\n      <td>${tcs}<\/td>\n    <\/tr>`;\n  }).join(\"\");\n  openModal(`\n    <h3>Decomposed specifications & coverage analysis<\/h3>\n    <table class=\"detail\">\n      <thead><tr><th>Spec ID<\/th><th>Description<\/th><th>Acceptance criteria<\/th><th>Covered?<\/th><th>Covering TCs (dimensions)<\/th><\/tr><\/thead>\n      <tbody>${rows}<\/tbody>\n    <\/table>\n  `);"}, "imports": ["qaai/viewer/common/shared.js"], "imported_by": []}, {"path": "qaai/viewer/test_case_reviewer/script.js", "language": "javascript", "role": "Test-case viewer left-pane render + spec-axes/help modals", "explanation": "renderLeft() renders one TCReviewState record (test case, traced requirements, the 5-objective checklist), plus openAxes (per-spec coverage across decomposed requirements) and openCriteriaHelp modals; feedbackKey is test_id.", "python_analogy": "A sibling page controller with the same shape as the RTM one, differing only in the record fields it reads.", "key_snippet": {"start": 39, "end": 48, "code": "  const findings = checklist.map(o => {\n    const chipClass = (o.verdict === \"Yes\" && o.partial) ? \"Yellow\" : o.verdict;\n    const isRecommended = o.mandatory === false;\n    const rowClass = isRecommended ? ' class=\"recommended\"' : '';\n    return `<tr${rowClass}>\n      <td><strong>${escapeHTML(o.id)}<\/strong><div class=\"obj-desc\">${escapeHTML(o.description)}<\/div><\/td>\n      <td><span class=\"chip chip-${chipClass}\">${escapeHTML(o.verdict ?? \"?\")}<\/span><\/td>\n      <td>${escapeHTML(o.assessment ?? \"\")}<\/td>\n    <\/tr>`;\n  }).join(\"\");"}, "imports": ["qaai/viewer/common/shared.js"], "imported_by": []}, {"path": "qaai/viewer/hazard_reviewer/script.js", "language": "javascript", "role": "Hazard viewer left-pane render + coverage/TC/help modals", "explanation": "renderLeft() renders one HazardReviewState record: the SHA register fields, per-requirement RTM evidence cards, test cases, and the H1–H6+R7 findings table; openReqCoverage/openCoverageIndex drill into the embedded RTM spec-by-spec coverage; feedbackKey is hazard_id.", "python_analogy": "The most detailed of the three page controllers — a vanilla-JS view rendering nested evidence from the hazard record.", "key_snippet": {"start": 67, "end": 93, "code": "  const reviews = rec.requirement_reviews ?? [];\n  const reviewByReqId = Object.fromEntries(reviews.map(r => [r.requirement?.req_id, r]));\n  const reqList = (haz.requirements_traceability?.requirements ?? []).map(req => {\n    const r = reviewByReqId[req.req_id];\n    const sa = r?.synthesized_assessment;\n    const mfChips = (sa?.mandatory_findings ?? []).map(f => {\n      const cls = (f.verdict === \"Yes\" && f.partial) ? \"Yellow\" : f.verdict;\n      return `<span class=\"m-row\"><span class=\"m-code\">${escapeHTML(f.code)}<\/span><span class=\"chip chip-${cls}\">${escapeHTML(f.verdict)}<\/span><\/span>`;\n    }).join(\"\");\n    const verdict = sa?.overall_verdict ?? \"—\";\n    const verdictChip = (verdict === \"Yes\" || verdict === \"No\")\n      ? `<span class=\"chip chip-${verdict}\">${escapeHTML(verdict)}<\/span>`\n      : `<span class=\"cited\">${escapeHTML(verdict)}<\/span>`;\n    const idx_ = reviews.indexOf(r);\n    const link = idx_ >= 0\n      ? `<span class=\"link-like\" onclick=\"openReqCoverage(${idx_})\">spec-by-spec coverage →<\/span>`\n      : \"\";\n    return `<div class=\"req-card\">\n      <div class=\"req-head\">\n        <span class=\"req-id\">${escapeHTML(req.req_id)}<\/span>\n        ${verdictChip}\n        ${link}\n      <\/div>\n      <div style=\"margin-top:6px\">${escapeHTML(req.text ?? \"\")}<\/div>\n      ${mfChips ? `<div style=\"margin-top:8px\">${mfChips}<\/div>` : \"\"}\n    <\/div>`;\n  }).join(\"\");"}, "imports": ["qaai/viewer/common/shared.js"], "imported_by": []}, {"path": "qaai/api/static/index.html", "language": "html", "role": "Legacy build-less single-page reviewer UI (fallback)", "explanation": "The vanilla HTML page served when the Vue dist/ build is absent. Three reviewer cards (RTM / TC / hazard) with baseline/file inputs, a cache-mode radio, test-mode + edge-case/decomposition toggles, a status/progress area, and a feedback-upload footer.", "python_analogy": "A plain index.html with inline onclick handlers — the no-build-step fallback before the Vue SPA, like a static page wired to a script.js.", "key_snippet": {"start": 54, "end": 76, "code": "          <div class=\"cache-toggle cache-radio\">\n            <div class=\"cache-radio-head\">\n              <span class=\"cache-radio-title\">Cache mode<\/span>\n              <span\n                class=\"cache-info\"\n                tabindex=\"0\"\n                title=\"'On' (default): reuse the newest cached interim analysis and only re-run the final assessment fresh, saving a new timestamped result. 'Test': recreate the report entirely from cached results with no LLM calls (and JAMA read from cache) — fails if any node result is missing. 'Off': re-run every node and save a new timestamped result, reusing nothing. Files are kept as immutable, timestamped history under ./shared/runs; a run that errors or comes out incomplete purges only the files it just wrote.\"\n                >i<\/span\n              >\n            <\/div>\n            <label class=\"cache-check\">\n              <input type=\"radio\" name=\"rtm-cache\" value=\"on\" checked />\n              <span>On (reuse cached, fresh final)<\/span>\n            <\/label>\n            <label class=\"cache-check\">\n              <input type=\"radio\" name=\"rtm-cache\" value=\"test\" />\n              <span>Test (recreate from cache, no LLM)<\/span>\n            <\/label>\n            <label class=\"cache-check\">\n              <input type=\"radio\" name=\"rtm-cache\" value=\"off\" />\n              <span>Off (re-run all, save timestamped)<\/span>\n            <\/label>\n          <\/div>"}, "imports": ["qaai/api/static/script.js", "qaai/api/static/style.css"], "imported_by": []}, {"path": "qaai/api/static/script.js", "language": "javascript", "role": "Legacy UI logic: detectRootPath + submit/poll/download engine", "explanation": "The vanilla app's brains: detectRootPath() for the JupyterHub/ALB proxy prefix, the runJob() 202→poll→download loop with a pollToken supersede guard, progress/result/error rendering, Stop-Run cancellation, baseline + hazard submit handlers, drag-and-drop, and feedback upload. Its logic was ported verbatim into the Vue stores.", "python_analogy": "A single script.js holding all page behavior — the pre-framework version of what became the Pinia job store.", "key_snippet": {"start": 264, "end": 290, "code": "async function runJob(endpoint, fetchOpts, filename, label, baseSub) {\n  showLoading(`Running ${label}…`, baseSub);\n  setButtons(true);\n  const startTs = Date.now();\n  const myToken = ++pollToken; // claim this run; supersedes any earlier poll loop\n  const shown = { n: 0 }; // how many run-log messages we've already rendered\n  try {\n    const submit = await fetch(ROOT_PATH + endpoint, fetchOpts);\n    if (!submit.ok) throw new Error(await parseErr(submit));\n    const { job_id } = await submit.json();\n    if (!job_id) throw new Error(\"Server did not return a job_id.\");\n    currentJobId = job_id;\n    document.getElementById(\"btn-stop\").hidden = false; // allow Stop Run\n\n    // Poll status until the job reaches a terminal state.\n    while (true) {\n      await new Promise((r) => setTimeout(r, POLL_INTERVAL_MS));\n      // Abort quietly if a newer run/card-switch has superseded this loop.\n      if (myToken !== pollToken) return;\n      if (Date.now() - startTs > MAX_POLL_MS) {\n        throw new Error(\n          \"Timed out waiting for the review to finish (30 min). \" +\n            \"The job may still be running on the server — try again later.\",\n        );\n      }\n      const statusResp = await fetch(ROOT_PATH + \"/api/v1/jobs/\" + job_id);\n      if (!statusResp.ok) throw new Error(await parseErr(statusResp));"}, "imports": [], "imported_by": ["qaai/api/static/index.html"]}, {"path": "qaai/api/static/style.css", "language": "css", "role": "Legacy UI theme (dark terminal/amber)", "explanation": "The full stylesheet for the build-less page: the :root design tokens, header, reviewer cards, form fields, dropzone, submit button, status/progress/result/error boxes, cache toggles, and animations. Its :root block was ported verbatim into the Vue app's tokens.css.", "python_analogy": "A hand-written CSS file with :root custom properties — the design system the Vue SPA later split into tokens/base/forms.", "key_snippet": {"start": 330, "end": 357, "code": ".btn-submit {\n  width: 100%;\n  margin-top: 6px;\n  padding: 13px 24px;\n  background: linear-gradient(\n    135deg,\n    #c07a08 0%,\n    #e8930a 50%,\n    #c07a08 100%\n  );\n  background-size: 200% 200%;\n  background-position: 100% 0;\n  border: none;\n  color: #0a0600;\n  font-family: var(--display);\n  font-size: 14px;\n  font-weight: 700;\n  letter-spacing: 0.06em;\n  text-transform: uppercase;\n  cursor: pointer;\n  transition:\n    background-position 0.4s ease,\n    opacity 0.2s;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 10px;\n}"}, "imports": [], "imported_by": ["qaai/api/static/index.html"]}, {"path": "qaai/web/src/main.ts", "language": "typescript", "role": "SPA bootstrap (Vue + Pinia + Router + global styles)", "explanation": "Creates the Vue app, installs Pinia and the router, imports the three global stylesheets, and mounts #app.", "python_analogy": "The entry point — like a main.py that wires the app object and calls run(), here createApp().use(...).mount().", "key_snippet": {"start": 1, "end": 13, "code": "import { createApp } from \"vue\";\nimport { createPinia } from \"pinia\";\nimport App from \"./App.vue\";\nimport router from \"./router\";\n\nimport \"./styles/tokens.css\";\nimport \"./styles/base.css\";\nimport \"./styles/forms.css\";\n\nconst app = createApp(App);\napp.use(createPinia());\napp.use(router);\napp.mount(\"#app\");"}, "imports": ["qaai/web/src/App.vue", "qaai/web/src/router/index.ts", "qaai/web/src/styles/tokens.css", "qaai/web/src/styles/base.css", "qaai/web/src/styles/forms.css"], "imported_by": ["qaai/web/index.html"]}, {"path": "qaai/web/src/App.vue", "language": "vue", "role": "Root shell (header / router-view / footer)", "explanation": "The app shell: renders AppHeader, the routed view, and AppFooter, and kicks off identity loading on mount (the router guard also awaits it).", "python_analogy": "The root component — like a base template that yields to the current page, similar to a layout.html with a content block.", "key_snippet": {"start": 1, "end": 16, "code": "<script setup lang=\"ts\">\nimport { onMounted } from \"vue\";\nimport { useAuthStore } from \"./stores/auth\";\nimport AppHeader from \"./components/AppHeader.vue\";\nimport AppFooter from \"./components/AppFooter.vue\";\n\n// Kick off identity load early (the router guard also awaits it).\nconst auth = useAuthStore();\nonMounted(() => auth.loadIdentity());\n<\/script>\n\n<template>\n  <AppHeader />\n  <router-view />\n  <AppFooter />\n<\/template>"}, "imports": ["qaai/web/src/stores/auth.ts", "qaai/web/src/components/AppHeader.vue", "qaai/web/src/components/AppFooter.vue"], "imported_by": ["qaai/web/src/main.ts"]}, {"path": "qaai/web/src/types.ts", "language": "typescript", "role": "Shared TypeScript domain types", "explanation": "The client-side type vocabulary: Role/Permission/User/Identity (RBAC), ReviewKind/CacheMode, JobMessage/JobStatus (the GET /jobs/{id} shape), the reactive Phase, and BaselineReviewRequest (the review POST body). Kept in sync with the backend contract.", "python_analogy": "A types module — the TypeScript equivalent of a pydantic models file shared across the frontend.", "key_snippet": {"start": 30, "end": 54, "code": "/** Shape returned by GET /api/v1/jobs/{id} (Job.to_status_dict on the backend). */\nexport interface JobStatus {\n  job_id: string;\n  status: \"pending\" | \"running\" | \"completed\" | \"failed\" | \"cancelled\";\n  filename?: string | null;\n  error?: string | null;\n  total?: number;\n  done?: number;\n  succeeded?: number;\n  failed?: number;\n  eta_seconds?: number | null;\n  messages?: JobMessage[];\n}\n\n/** Reactive lifecycle phase the status UI binds to. */\nexport type Phase = \"idle\" | \"loading\" | \"done\" | \"error\";\n\n/** JSON body for the RTM / TC (baseline) review endpoints. */\nexport interface BaselineReviewRequest {\n  baseline_id: string;\n  cache_mode: CacheMode;\n  test_mode: boolean;\n  include_edge_case_analysis: boolean;\n  include_decomposition_analysis: boolean;\n}"}, "imports": [], "imported_by": ["qaai/web/src/stores/job.ts", "qaai/web/src/api/reviews.ts", "qaai/web/src/stores/auth.ts", "qaai/web/src/components/forms/RtmForm.vue"]}, {"path": "qaai/web/src/constants.ts", "language": "typescript", "role": "Polling constants, RBAC permission map, tooltip copy", "explanation": "POLL_INTERVAL_MS/MAX_POLL_MS (ported verbatim from the vanilla app), ROLE_PERMISSIONS (the single source of truth mapping roles→UI actions, mirrored server-side in config.py), ALL_ROLES, and the centralized TOOLTIPS strings for the form controls.", "python_analogy": "A constants module — like a settings/constants.py holding the RBAC matrix and copy strings.", "key_snippet": {"start": 14, "end": 20, "code": "export const ROLE_PERMISSIONS: Record<Role, Permission[]> = {\n  admin: [\"run_review\", \"upload_feedback\", \"manage\"],\n  reviewer: [\"run_review\", \"upload_feedback\"],\n  viewer: [],\n};\n\nexport const ALL_ROLES: Role[] = [\"admin\", \"reviewer\", \"viewer\"];"}, "imports": [], "imported_by": ["qaai/web/src/stores/auth.ts", "qaai/web/src/stores/job.ts", "qaai/web/src/components/forms/RtmForm.vue", "qaai/web/src/components/forms/TcForm.vue", "qaai/web/src/components/forms/HazardForm.vue"]}, {"path": "qaai/web/src/router/index.ts", "language": "typescript", "role": "Hash-mode router + auth/role route guard", "explanation": "Two routes (home, unauthorized) in hash mode (so deep links work under any proxy prefix without server fallback). beforeEach ensures identity is loaded then enforces requiresAuth and optional per-route roles — UX gating only; the backend must enforce the same later.", "python_analogy": "A router with a beforeEach guard — like Flask's before_request checking session auth before dispatch.", "key_snippet": {"start": 32, "end": 44, "code": "router.beforeEach(async (to) => {\n  const auth = useAuthStore();\n  if (!auth.loaded) await auth.loadIdentity();\n\n  if (to.meta.requiresAuth && !auth.isAuthenticated) {\n    return { name: \"unauthorized\" };\n  }\n  const roles = to.meta.roles as Role[] | undefined;\n  if (roles && !roles.some((r) => auth.hasRole(r))) {\n    return { name: \"unauthorized\" };\n  }\n  return true;\n});"}, "imports": ["qaai/web/src/stores/auth.ts", "qaai/web/src/types.ts", "qaai/web/src/views/ReviewHome.vue", "qaai/web/src/views/Unauthorized.vue"], "imported_by": ["qaai/web/src/main.ts"]}, {"path": "qaai/web/src/stores/auth.ts", "language": "typescript", "role": "Pinia auth store (identity + roles, hasRole/can)", "explanation": "Hydrates identity once from GET /api/v1/me and exposes isAuthenticated, hasRole(role), and can(permission) (via ROLE_PERMISSIONS) to drive route guards and role-gated components. Fails resolved-as-unauthenticated on error so guards can proceed.", "python_analogy": "A global state store — like a singleton auth service holding current_user and permission checks, similar to a request-scoped user object promoted to app scope.", "key_snippet": {"start": 33, "end": 52, "code": "  async function loadIdentity(force = false): Promise<void> {\n    if (loaded.value && !force) return;\n    loading.value = true;\n    error.value = null;\n    try {\n      const resp = await apiFetch(\"/api/v1/me\");\n      if (!resp.ok) throw new Error(await parseErr(resp));\n      const data: Identity = await resp.json();\n      user.value = data.user ?? null;\n      roles.value = data.roles ?? [];\n      loaded.value = true;\n    } catch (e) {\n      user.value = null;\n      roles.value = [];\n      loaded.value = true; // resolved (as unauthenticated) so guards can proceed\n      error.value = e instanceof Error ? e.message : String(e);\n    } finally {\n      loading.value = false;\n    }\n  }"}, "imports": ["qaai/web/src/api/client.ts", "qaai/web/src/constants.ts", "qaai/web/src/types.ts"], "imported_by": ["qaai/web/src/App.vue", "qaai/web/src/router/index.ts", "qaai/web/src/components/AppHeader.vue", "qaai/web/src/components/controls/SubmitButton.vue", "qaai/web/src/components/FeedbackUpload.vue"]}, {"path": "qaai/web/src/stores/job.ts", "language": "typescript", "role": "Pinia job store (the async 202→poll→download engine)", "explanation": "The reactive port of the vanilla runJob(): start() submits, then polls getJobStatus every 4s and downloads the result blob on completion; a monotonic generation token + AbortController supersede any in-flight loop on a new run/stop/reviewer switch. Exposes phase/progress/result/error refs the status components bind to.", "python_analogy": "A store that owns a long-running async workflow — like an actor holding a state machine (idle→loading→done/error) that components subscribe to.", "key_snippet": {"start": 123, "end": 150, "code": "      while (true) {\n        await sleep(POLL_INTERVAL_MS);\n        if (myGen !== generation) return;\n        if (Date.now() - startTs.value > MAX_POLL_MS) {\n          throw new Error(\n            \"Timed out waiting for the review to finish (30 min). \" +\n              \"The job may still be running on the server — try again later.\",\n          );\n        }\n        const job = await getJobStatus(jobId, signal);\n        if (myGen !== generation) return;\n        applyJob(job);\n\n        if (job.status === \"completed\") {\n          const blob = await getJobResult(jobId, signal);\n          if (myGen !== generation) return;\n          revokeResult();\n          resultUrl.value = URL.createObjectURL(blob);\n          resultFilename.value = opts.filename;\n          resultJob.value = job;\n          phase.value = \"done\";\n          currentJobId.value = null;\n          return;\n        }\n        if (job.status === \"failed\") {\n          throw new Error(job.error || \"Review failed.\");\n        }\n      }"}, "imports": ["qaai/web/src/api/reviews.ts", "qaai/web/src/constants.ts", "qaai/web/src/types.ts"], "imported_by": ["qaai/web/src/components/ReviewerSelector.vue", "qaai/web/src/components/forms/RtmForm.vue", "qaai/web/src/components/status/StatusPanel.vue", "qaai/web/src/components/status/ProgressPanel.vue", "qaai/web/src/components/status/ResultBox.vue"]}, {"path": "qaai/web/src/api/client.ts", "language": "typescript", "role": "Fetch wrapper: proxy-prefix detection + auth-header seam", "explanation": "detectRootPath() (ported verbatim) computes the JupyterHub/ALB proxy prefix; apiUrl/apiFetch prefix every request with it and inject auth headers (a seam for a future in-app JWT); parseErr uniformly extracts 'status: detail' from a failed Response.", "python_analogy": "A thin fetch() wrapper module — like a requests.Session with a base_url and default headers, centralizing every call.", "key_snippet": {"start": 30, "end": 49, "code": "export function apiUrl(path: string): string {\n  return ROOT_PATH + path;\n}\n\n/**\n * Auth-header injection seam. In the ALB + OIDC model the edge authenticates and\n * the browser sends the auth cookie automatically (same-origin), so no header is\n * needed here. If the identity provider is later swapped for Cognito (in-app JWT),\n * return `{ Authorization: \\`Bearer ${token}\\` }` from here — the single place all\n * requests flow through.\n */\nexport function authHeaders(): Record<string, string> {\n  return {};\n}\n\n/** fetch() that prefixes ROOT_PATH and injects auth headers. */\nexport function apiFetch(path: string, opts: RequestInit = {}): Promise<Response> {\n  const headers = { ...authHeaders(), ...(opts.headers as Record<string, string>) };\n  return fetch(apiUrl(path), { ...opts, headers });\n}"}, "imports": [], "imported_by": ["qaai/web/src/api/reviews.ts", "qaai/web/src/stores/auth.ts", "qaai/web/src/components/AppFooter.vue"]}, {"path": "qaai/web/src/api/reviews.ts", "language": "typescript", "role": "Typed API calls (submit / status / result / cancel / feedback)", "explanation": "The endpoint client: submitBaselineReview / submitHazardReview (→ 202 job_id), getJobStatus, getJobResult (blob), cancelJob, and uploadFeedback — each wrapping apiFetch with error handling.", "python_analogy": "An API-client module of typed functions — like a generated SDK method per endpoint.", "key_snippet": {"start": 5, "end": 20, "code": "export async function submitBaselineReview(\n  endpoint: string,\n  body: BaselineReviewRequest,\n  signal?: AbortSignal,\n): Promise<string> {\n  const resp = await apiFetch(endpoint, {\n    method: \"POST\",\n    headers: { \"Content-Type\": \"application/json\" },\n    body: JSON.stringify(body),\n    signal,\n  });\n  if (!resp.ok) throw new Error(await parseErr(resp));\n  const { job_id } = await resp.json();\n  if (!job_id) throw new Error(\"Server did not return a job_id.\");\n  return job_id;\n}"}, "imports": ["qaai/web/src/api/client.ts", "qaai/web/src/types.ts"], "imported_by": ["qaai/web/src/stores/job.ts", "qaai/web/src/components/FeedbackUpload.vue"]}, {"path": "qaai/web/src/views/ReviewHome.vue", "language": "vue", "role": "Home view (reviewer selector + status panel)", "explanation": "The single main page: composes ReviewerSelector over StatusPanel in a centered column.", "python_analogy": "A page/view component — like a route handler's template that assembles two child widgets.", "key_snippet": {"start": 1, "end": 11, "code": "<script setup lang=\"ts\">\nimport ReviewerSelector from \"../components/ReviewerSelector.vue\";\nimport StatusPanel from \"../components/status/StatusPanel.vue\";\n<\/script>\n\n<template>\n  <div class=\"review-home\">\n    <ReviewerSelector />\n    <StatusPanel />\n  <\/div>\n<\/template>"}, "imports": ["qaai/web/src/components/ReviewerSelector.vue", "qaai/web/src/components/status/StatusPanel.vue"], "imported_by": ["qaai/web/src/router/index.ts"]}, {"path": "qaai/web/src/views/Unauthorized.vue", "language": "vue", "role": "Access-denied view", "explanation": "Shown by the route guard when the caller is unauthenticated or lacks a permitted role; explains the situation and echoes the signed-in name + roles.", "python_analogy": "A 403 page component bound to the auth store's error/roles.", "key_snippet": {"start": 7, "end": 23, "code": "<template>\n  <section class=\"unauthorized\">\n    <div class=\"lock\" aria-hidden=\"true\">⛔<\/div>\n    <h2>Access denied<\/h2>\n    <p v-if=\"auth.error\">\n      We could not verify your identity. Please sign in through your organization's\n      portal and reload.\n    <\/p>\n    <p v-else>\n      Your account is authenticated but does not have a role permitted to use this\n      reviewer. Contact an administrator to be granted the Reviewer or Admin role.\n    <\/p>\n    <p class=\"detail\">\n      <span v-if=\"auth.user\">Signed in as {{ auth.user.name }}.<\/span>\n      Roles: {{ auth.roles.length ? auth.roles.join(\", \") : \"none\" }}.\n    <\/p>\n  <\/section>"}, "imports": ["qaai/web/src/stores/auth.ts"], "imported_by": ["qaai/web/src/router/index.ts"]}, {"path": "qaai/web/src/components/AppHeader.vue", "language": "vue", "role": "App header (branding + signed-in identity/roles)", "explanation": "The QAAI wordmark, subtitle, and — when authenticated — the user name and role badges from the auth store.", "python_analogy": "A header component reading global auth state — like a navbar partial that shows the current user.", "key_snippet": {"start": 7, "end": 21, "code": "<template>\n  <header class=\"header\">\n    <div class=\"logo-row\"> nd": 33, "code": "    <ReviewerCard\n      id=\"rtm\"\n      title=\"Requirement Coverage\"\n      badge=\"Test Suite Review\"\n      :active=\"active === 'rtm'\"\n      @select=\"select('rtm')\"\n    >\n      <RtmForm />\n    <\/ReviewerCard>"}, "imports": ["qaai/web/src/components/ReviewerCard.vue", "qaai/web/src/components/forms/RtmForm.vue", "qaai/web/src/components/forms/TcForm.vue", "qaai/web/src/components/forms/HazardForm.vue", "qaai/web/src/stores/job.ts", "qaai/web/src/types.ts"], "imported_by": ["qaai/web/src/views/ReviewHome.vue"]}, {"path": "qaai/web/src/components/ReviewerCard.vue", "language": "vue", "role": "Collapsible reviewer card (header + slotted form)", "explanation": "A presentational card: an accessible role=button header (click/Enter/Space emits select) and a slot that shows its form only when active.", "python_analogy": "A reusable collapsible panel component with a default slot — like a Bootstrap accordion item.", "key_snippet": {"start": 13, "end": 32, "code": "<template>\n  <div class=\"card\" :class=\"{ active }\" :id=\"`card-${id}`\">\n    <div\n      class=\"card-header\"\n      role=\"button\"\n      tabindex=\"0\"\n      :aria-expanded=\"active\"\n      @click=\"emit('select')\"\n      @keydown=\"onKeydown\"\n    >\n      <div class=\"radio-dot\"><\/div>\n      <span class=\"card-title\">{{ title }}<\/span>\n      <span class=\"card-badge\">{{ badge }}<\/span>\n    <\/div>\n    <div v-show=\"active\" class=\"form-panel\">\n      <div class=\"panel-rule\"><\/div>\n      <slot />\n    <\/div>\n  <\/div>\n<\/template>"}, "imports": [], "imported_by": ["qaai/web/src/components/ReviewerSelector.vue"]}, {"path": "qaai/web/src/components/FeedbackUpload.vue", "language": "vue", "role": "Role-gated feedback-JSON upload control", "explanation": "Lets a reviewer/admin pick an exported feedback JSON and POST it (uploadFeedback → ./shared/feedback/); hidden entirely from viewers via auth.can('upload_feedback').", "python_analogy": "A small file-upload widget guarded by a permission check.", "key_snippet": {"start": 24, "end": 37, "code": "async function upload() {\n  const file = fileInput.value?.files?.[0];\n  if (!file) {\n    alert(\"Please choose a feedback JSON file first.\");\n    return;\n  }\n  status.value = \"Uploading…\";\n  try {\n    const saved = await uploadFeedback(file);\n    status.value = \"Uploaded ✓ \" + saved;\n  } catch (e) {\n    status.value = \"Upload failed — \" + (e instanceof Error ? e.message : String(e));\n  }\n}"}, "imports": ["qaai/web/src/stores/auth.ts", "qaai/web/src/api/reviews.ts"], "imported_by": ["qaai/web/src/components/AppFooter.vue"]}, {"path": "qaai/web/src/components/forms/RtmForm.vue", "language": "vue", "role": "RTM (test-suite) review form", "explanation": "Collects baseline id, cache mode, test mode, and the edge-case toggle, then calls job.start() with the /api/v1/test-suite-review submit closure and the result filename/labels.", "python_analogy": "A form component that assembles a request payload and kicks off the job store — like an HTML form whose submit handler posts and then polls.", "key_snippet": {"start": 19, "end": 42, "code": "function run() {\n  const id = baseline.value.trim();\n  if (!id) {\n    alert(\"Please enter a JAMA Baseline ID.\");\n    return;\n  }\n  job.start({\n    submit: (signal) =>\n      submitBaselineReview(\n        \"/api/v1/test-suite-review\",\n        {\n          baseline_id: id,\n          cache_mode: cacheMode.value,\n          test_mode: testMode.value,\n          include_edge_case_analysis: edgeCase.value,\n          include_decomposition_analysis: true,\n        },\n        signal,\n      ),\n    filename: \"qaai_rtm_review.html\",\n    label: \"Requirement Coverage Review\",\n    baseSub: `Fetching baseline ${id} from JAMA and processing requirements. This may take several minutes.`,\n  });\n}"}, "imports": ["qaai/web/src/components/controls/TextField.vue", "qaai/web/src/components/controls/CacheModeRadio.vue", "qaai/web/src/components/controls/LabeledCheckbox.vue", "qaai/web/src/components/controls/SubmitButton.vue", "qaai/web/src/stores/job.ts", "qaai/web/src/api/reviews.ts", "qaai/web/src/constants.ts"], "imported_by": ["qaai/web/src/components/ReviewerSelector.vue"]}, {"path": "qaai/web/src/components/forms/TcForm.vue", "language": "vue", "role": "Test-case review form", "explanation": "Like RtmForm but for /api/v1/test-case-review, with the decomposition toggle instead of edge-case.", "python_analogy": "A near-twin form component differing only in the toggle and endpoint.", "key_snippet": {"start": 19, "end": 42, "code": "function run() {\n  const id = baseline.value.trim();\n  if (!id) {\n    alert(\"Please enter a JAMA Baseline ID.\");\n    return;\n  }\n  job.start({\n    submit: (signal) =>\n      submitBaselineReview(\n        \"/api/v1/test-case-review\",\n        {\n          baseline_id: id,\n          cache_mode: cacheMode.value,\n          test_mode: testMode.value,\n          include_edge_case_analysis: false,\n          include_decomposition_analysis: includeDecomp.value,\n        },\n        signal,\n      ),\n    filename: \"qaai_tc_review.html\",\n    label: \"Test Case Adequacy Review\",\n    baseSub: `Fetching baseline ${id} from JAMA and processing requirements. This may take several minutes.`,\n  });\n}"}, "imports": ["qaai/web/src/components/controls/TextField.vue", "qaai/web/src/components/controls/CacheModeRadio.vue", "qaai/web/src/components/controls/LabeledCheckbox.vue", "qaai/web/src/components/controls/SubmitButton.vue", "qaai/web/src/stores/job.ts", "qaai/web/src/api/reviews.ts", "qaai/web/src/constants.ts"], "imported_by": ["qaai/web/src/components/ReviewerSelector.vue"]}, {"path": "qaai/web/src/components/forms/HazardForm.vue", "language": "vue", "role": "Hazard review form (multipart Excel upload)", "explanation": "Collects project name, an Excel file (FileDropzone), sheet name, identifier pattern, cache/test mode, and the edge-case toggle, builds a multipart FormData, and starts the hazard job.", "python_analogy": "A multipart form component — like an HTML form with enctype=multipart/form-data assembling FormData before submit.", "key_snippet": {"start": 23, "end": 50, "code": "function run() {\n  const name = project.value.trim();\n  if (!name) {\n    alert(\"Please enter a project name.\");\n    return;\n  }\n  if (!file.value) {\n    alert(\"Please upload a SHA Excel file.\");\n    return;\n  }\n  const selected = file.value;\n\n  const form = new FormData();\n  form.append(\"project_name\", name);\n  form.append(\"file\", selected);\n  form.append(\"sheet_name\", sheet.value.trim() || \"SHA Table\");\n  form.append(\"identifier_pattern\", identifierPattern.value.trim() || \"GID-\\\\d+\");\n  form.append(\"cache_mode\", cacheMode.value);\n  form.append(\"test_mode\", String(testMode.value));\n  form.append(\"include_edge_case_analysis\", String(edgeCase.value));\n\n  job.start({\n    submit: (signal) => submitHazardReview(form, signal),\n    filename: \"qaai_hazard_review.html\",\n    label: \"Hazard Risk Review\",\n    baseSub: `Processing ${selected.name} · ${name}. This may take several minutes per hazard row.`,\n  });\n}"}, "imports": ["qaai/web/src/components/controls/TextField.vue", "qaai/web/src/components/controls/FileDropzone.vue", "qaai/web/src/components/controls/CacheModeRadio.vue", "qaai/web/src/components/controls/LabeledCheckbox.vue", "qaai/web/src/components/controls/SubmitButton.vue", "qaai/web/src/stores/job.ts", "qaai/web/src/api/reviews.ts", "qaai/web/src/constants.ts"], "imported_by": ["qaai/web/src/components/ReviewerSelector.vue"]}, {"path": "qaai/web/src/components/controls/InfoTooltip.vue", "language": "vue", "role": "The 'i' info badge with a native title tooltip", "explanation": "A tiny presentational span styled by the global .cache-info class, keyboard-focusable, showing its text as a native title tooltip.", "python_analogy": "A leaf UI atom — like a reusable <Tooltip> with no logic.", "key_snippet": {"start": 1, "end": 9, "code": "<script setup lang=\"ts\">\n// The small \"i\" badge with a native title tooltip. Uses the global .cache-info\n// style (styles/forms.css). tabindex=0 so it's keyboard-focusable.\ndefineProps<{ text: string }>();\n<\/script>\n\n<template>\n  <span class=\"cache-info\" tabindex=\"0\" :title=\"text\">i<\/span>\n<\/template>"}, "imports": [], "imported_by": ["qaai/web/src/components/controls/CacheModeRadio.vue", "qaai/web/src/components/controls/LabeledCheckbox.vue"]}, {"path": "qaai/web/src/components/controls/TextField.vue", "language": "vue", "role": "Labeled text input (v-model)", "explanation": "A controlled text field with a label, optional '(optional)' marker, and placeholder, emitting update:modelValue.", "python_analogy": "A form-input wrapper component — the Vue equivalent of a reusable labeled <input> widget.", "key_snippet": {"start": 12, "end": 27, "code": "<template>\n  <div class=\"field\">\n    <label :for=\"id\">\n      {{ label }}\n      <span v-if=\"optional\" class=\"field-optional\">(optional)<\/span>\n    <\/label>\n    <input\n      :id=\"id\"\n      type=\"text\"\n      :placeholder=\"placeholder\"\n      autocomplete=\"off\"\n      :value=\"modelValue\"\n      @input=\"$emit('update:modelValue', ($event.target as HTMLInputElement).value)\"\n    />\n  <\/div>\n<\/template>"}, "imports": [], "imported_by": ["qaai/web/src/components/forms/RtmForm.vue", "qaai/web/src/components/forms/TcForm.vue", "qaai/web/src/components/forms/HazardForm.vue"]}, {"path": "qaai/web/src/components/controls/CacheModeRadio.vue", "language": "vue", "role": "Cache-mode radio group (on / test / off)", "explanation": "A three-option radio bound via v-model, with a heading and an InfoTooltip explaining the modes.", "python_analogy": "A radio-group control component with a fixed option list.", "key_snippet": {"start": 15, "end": 32, "code": "<template>\n  <div class=\"cache-toggle cache-radio\">\n    <div class=\"cache-radio-head\">\n      <span class=\"cache-radio-title\">Cache mode<\/span>\n      <InfoTooltip :text=\"tooltip\" />\n    <\/div>\n    <label v-for=\"o in options\" :key=\"o.value\" class=\"cache-check\">\n      <input\n        type=\"radio\"\n        :name=\"name\"\n        :value=\"o.value\"\n        :checked=\"modelValue === o.value\"\n        @change=\"emit('update:modelValue', o.value)\"\n      />\n      <span>{{ o.label }}<\/span>\n    <\/label>\n  <\/div>\n<\/template>"}, "imports": ["qaai/web/src/components/controls/InfoTooltip.vue", "qaai/web/src/types.ts"], "imported_by": ["qaai/web/src/components/forms/RtmForm.vue", "qaai/web/src/components/forms/TcForm.vue", "qaai/web/src/components/forms/HazardForm.vue"]}, {"path": "qaai/web/src/components/controls/LabeledCheckbox.vue", "language": "vue", "role": "Labeled checkbox with optional tooltip (v-model)", "explanation": "A boolean checkbox with a label and an optional InfoTooltip, emitting update:modelValue.", "python_analogy": "A checkbox control atom — a reusable labeled toggle.", "key_snippet": {"start": 13, "end": 26, "code": "<template>\n  <div class=\"cache-toggle\">\n    <label class=\"cache-check\">\n      <input\n        :id=\"id\"\n        type=\"checkbox\"\n        :checked=\"modelValue\"\n        @change=\"emit('update:modelValue', ($event.target as HTMLInputElement).checked)\"\n      />\n      <span>{{ label }}<\/span>\n    <\/label>\n    <InfoTooltip v-if=\"tooltip\" :text=\"tooltip\" />\n  <\/div>\n<\/template>"}, "imports": ["qaai/web/src/components/controls/InfoTooltip.vue"], "imported_by": ["qaai/web/src/components/forms/RtmForm.vue", "qaai/web/src/components/forms/TcForm.vue", "qaai/web/src/components/forms/HazardForm.vue"]}, {"path": "qaai/web/src/components/controls/FileDropzone.vue", "language": "vue", "role": "Drag-and-drop file picker (v-model File)", "explanation": "A click-or-drop file input that keeps the hidden <input>.files in sync and emits the selected File; shows the chosen filename.", "python_analogy": "A file-upload dropzone component — like a react-dropzone equivalent emitting the File up via v-model.", "key_snippet": {"start": 13, "end": 26, "code": "function onChange() {\n  emit(\"update:modelValue\", input.value?.files?.[0] ?? null);\n}\n\nfunction onDrop(e: DragEvent) {\n  dragOver.value = false;\n  const file = e.dataTransfer?.files?.[0];\n  if (!file) return;\n  // Reflect the dropped file into the hidden <input> too, so its .files stays in sync.\n  const dt = new DataTransfer();\n  dt.items.add(file);\n  if (input.value) input.value.files = dt.files;\n  emit(\"update:modelValue\", file);\n}"}, "imports": [], "imported_by": ["qaai/web/src/components/forms/HazardForm.vue"]}, {"path": "qaai/web/src/components/controls/SubmitButton.vue", "language": "vue", "role": "Permission-gated submit button", "explanation": "Disables itself when busy or when the auth store lacks the permission (default run_review), shows a tooltip and a view-only note otherwise, and emits click.", "python_analogy": "A button component wired to a permission check — like a @permission_required-decorated action rendered as disabled.", "key_snippet": {"start": 12, "end": 20, "code": "const auth = useAuthStore();\nconst allowed = computed(() => auth.can(props.permission));\nconst disabled = computed(() => props.busy || !allowed.value);\nconst title = computed(() =>\n  allowed.value\n    ? undefined\n    : \"You need the Reviewer or Admin role to run reviews.\",\n);\n<\/script>"}, "imports": ["qaai/web/src/stores/auth.ts", "qaai/web/src/types.ts"], "imported_by": ["qaai/web/src/components/forms/RtmForm.vue", "qaai/web/src/components/forms/TcForm.vue", "qaai/web/src/components/forms/HazardForm.vue"]}, {"path": "qaai/web/src/components/status/StatusPanel.vue", "language": "vue", "role": "Status container (spinner / result / error switch)", "explanation": "Reads the job store's phase and renders the loading box (spinner + ProgressPanel + StopRunButton), ResultBox, or
