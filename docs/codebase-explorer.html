rc/components/status/StatusPanel.vue"]}, {"path": "qaai/web/src/components/status/ProgressLog.vue", "language": "vue", "role": "Live problem-note list", "explanation": "Renders the job store's messages as a scrollable list, colored by level (error/warning).", "python_analogy": "A simple list component mapping over reactive messages.", "key_snippet": {"start": 7, "end": 17, "code": "<template>\n  <ul v-if=\"messages.length\" class=\"progress-log\">\n    <li\n      v-for=\"(m, i) in messages\"\n      :key=\"i\"\n      :class=\"'log-' + (m.level || 'warning')\"\n    >\n      <span class=\"log-item\">{{ m.item_id ?? \"—\" }}<\/span>{{ m.text ?? \"\" }}\n    <\/li>\n  <\/ul>\n<\/template>"}, "imports": ["qaai/web/src/types.ts"], "imported_by": ["qaai/web/src/components/status/ProgressPanel.vue"]}, {"path": "qaai/web/src/components/status/ResultBox.vue", "language": "vue", "role": "Completion summary + report download", "explanation": "Builds the completion message from the resultJob counts (all-clean, clean-with-advisories, or partial/amber) and offers the download link for the report blob.", "python_analogy": "A result card component deriving its copy from final counts — mirrors the old renderResultSummary().", "key_snippet": {"start": 21, "end": 39, "code": "const primaryLine = computed(() => {\n  if (!total.value)\n    return \"Your report is ready. Click below to download the self-contained HTML viewer.\";\n  if (!partial.value)\n    return (\n      `All ${total.value} item${plural(total.value)} reviewed successfully.` +\n      (msgs.value.length\n        ? ` ${msgs.value.length} advisory note${plural(msgs.value.length)} recorded:`\n        : \" Your report is ready to download.\")\n    );\n  return (\n    `${succeeded.value} of ${total.value} item${plural(total.value)} completed cleanly — ` +\n    `${failed.value} did not complete fully:`\n  );\n});\nconst showList = computed(() => total.value > 0 && msgs.value.length > 0);\nconst trailingNote = computed(() =>\n  partial.value ? \"These items are also flagged in the report's “View log”.\" : \"\",\n);"}, "imports": ["qaai/web/src/stores/job.ts"], "imported_by": ["qaai/web/src/components/status/StatusPanel.vue"]}, {"path": "qaai/web/src/components/status/ErrorBox.vue", "language": "vue", "role": "Error display", "explanation": "Shows the job store's error string in an alert box.", "python_analogy": "A tiny error-banner component bound to store state.", "key_snippet": {"start": 7, "end": 13, "code": "<template>\n  <div class=\"error-box\" role=\"alert\">\n    <span class=\"error-mark\" aria-hidden=\"true\">✕<\/span>\n    <pre>{{ job.error }}<\/pre>\n  <\/div>\n<\/template>\n"}, "imports": ["qaai/web/src/stores/job.ts"], "imported_by": ["qaai/web/src/components/status/StatusPanel.vue"]}, {"path": "qaai/web/src/components/status/StopRunButton.vue", "language": "vue", "role": "Stop-run (cancel job) button", "explanation": "Calls job.stop() (cancel & discard) with a local disabled-while-stopping guard.", "python_analogy": "A single-action button that invokes a store method.", "key_snippet": {"start": 8, "end": 22, "code": "async function stop() {\n  stopping.value = true;\n  try {\n    await job.stop();\n  } finally {\n    stopping.value = false;\n  }\n}\n<\/script>\n\n<template>\n  <button type=\"button\" class=\"btn-stop\" :disabled=\"stopping\" @click=\"stop\">\n    ⏹ Stop Run\n  <\/button>\n<\/template>"}, "imports": ["qaai/web/src/stores/job.ts"], "imported_by": ["qaai/web/src/components/status/StatusPanel.vue"]}, {"path": "qaai/web/src/styles/tokens.css", "language": "css", "role": "Design tokens (:root theme variables)", "explanation": "The QAAI dark terminal theme as CSS custom properties (bg/surface/border/amber/green/red/blue/text/muted + font families), ported verbatim from the legacy stylesheet's :root block.", "python_analogy": "A theme/variables file — like a _tokens.scss of design constants every component references.", "key_snippet": {"start": 4, "end": 17, "code": ":root {\n  --bg: #070a0e;\n  --surface: #0e1219;\n  --border: #1c2330;\n  --amber: #e8930a;\n  --amber-dim: #7a4d05;\n  --green: #2cb67d;\n  --red: #c0392b;\n  --blue: #3b82f6;\n  --text: #d8dfe8;\n  --muted: #5a6478;\n  --mono: \"JetBrains Mono\", monospace;\n  --display: \"Syne\", sans-serif;\n}"}, "imports": [], "imported_by": ["qaai/web/src/main.ts"]}, {"path": "qaai/web/src/styles/base.css", "language": "css", "role": "Global reset, page chrome, shared keyframes", "explanation": "The reset, html/body background grid, the #app centered-column layout, and the global keyframes (fadeUp/slideDown/spin/shimmer) that scoped component styles reference by name.", "python_analogy": "A global base stylesheet — reset + layout + animations, like a normalize.css plus app shell.", "key_snippet": {"start": 33, "end": 40, "code": "   the footer sit at the bottom via margin-top:auto. */\n#app {\n  min-height: 100vh;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  padding: 60px 20px 80px;\n}"}, "imports": [], "imported_by": ["qaai/web/src/main.ts"]}, {"path": "qaai/web/src/styles/forms.css", "language": "css", "role": "Shared form primitives (fields, toggles, info badge)", "explanation": "Global styling for the reused control classes (.field, .cache-toggle/.cache-check, .cache-radio, .cache-info) so the small control components stay lean.", "python_analogy": "A shared component stylesheet for form atoms — like a _forms.scss partial.", "key_snippet": {"start": 68, "end": 85, "code": "/* Cache-mode radio group: a vertical stack of options with a heading row. */\n.cache-radio {\n  flex-direction: column;\n  align-items: flex-start;\n  gap: 6px;\n}\n.cache-radio-head {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n}\n.cache-radio-title {\n  font-weight: 600;\n  letter-spacing: 0.02em;\n}\n.cache-radio .cache-check {\n  padding-left: 2px;\n}"}, "imports": [], "imported_by": ["qaai/web/src/main.ts"]}, {"path": "qaai/web/vite.config.ts", "language": "typescript", "role": "Vite build config (relative base + dev API proxy)", "explanation": "base:'./' makes built assets relative so the SPA works under any proxy prefix; the @ alias points at src; the dev server proxies /api,/guide,/docs,/redoc to the FastAPI backend on :8000.", "python_analogy": "The build tool config — like a webpack.config.js / pyproject build section for the frontend.", "key_snippet": {"start": 9, "end": 32, "code": "export default defineConfig({\n  base: \"./\",\n  plugins: [vue()],\n  resolve: {\n    alias: {\n      \"@\": fileURLToPath(new URL(\"./src\", import.meta.url)),\n    },\n  },\n  build: {\n    outDir: \"dist\",\n    emptyOutDir: true,\n  },\n  server: {\n    port: 5173,\n    // In `npm run dev`, proxy backend paths to the FastAPI server so the Vue HMR\n    // dev server and the API run side by side. Production serves the built dist/\n    // from FastAPI itself, so this proxy is dev-only.\n    proxy: {\n      \"/api\": \"http://localhost:8000\",\n      \"/guide\": \"http://localhost:8000\",\n      \"/docs\": \"http://localhost:8000\",\n      \"/redoc\": \"http://localhost:8000\",\n    },\n  },"}, "imports": [], "imported_by": []}, {"path": "qaai/web/env.d.ts", "language": "typescript", "role": "Ambient types for Vite + .vue modules", "explanation": "Declares the vite/client types and the module shim so TypeScript can import *.vue single-file components.", "python_analogy": "A type-declaration file — the .d.ts equivalent of a stub telling the type checker about non-.ts imports.", "key_snippet": {"start": 1, "end": 7, "code": "/// <reference types=\"vite/client\" />\n\ndeclare module \"*.vue\" {\n  import type { DefineComponent } from \"vue\";\n  const component: DefineComponent<{}, {}, any>;\n  export default component;\n}"}, "imports": [], "imported_by": []}, {"path": "qaai/web/package.json", "language": "json", "role": "Frontend manifest (scripts + Vue/Vite deps)", "explanation": "npm manifest for the SPA: dev/build/preview/typecheck scripts and the Vue 3 + Pinia + Vue Router runtime deps with Vite/TypeScript/vue-tsc dev tooling.", "python_analogy": "The JS equivalent of pyproject.toml — dependencies plus run scripts.", "key_snippet": {"start": 7, "end": 24, "code": "  \"scripts\": {\n    \"dev\": \"vite\",\n    \"build\": \"vite build\",\n    \"preview\": \"vite preview\",\n    \"typecheck\": \"vue-tsc --noEmit\"\n  },\n  \"dependencies\": {\n    \"pinia\": \"^2.2.6\",\n    \"vue\": \"^3.5.13\",\n    \"vue-router\": \"^4.5.0\"\n  },\n  \"devDependencies\": {\n    \"@vitejs/plugin-vue\": \"^5.2.1\",\n    \"@types/node\": \"^22.10.1\",\n    \"typescript\": \"^5.6.3\",\n    \"vite\": \"^5.4.11\",\n    \"vue-tsc\": \"^2.1.10\"\n  }"}, "imports": [], "imported_by": []}, {"path": "qaai/web/tsconfig.json", "language": "json", "role": "TypeScript compiler config", "explanation": "Strict ESNext/bundler settings with the @/* path alias and the src/env/vite include set; noEmit (Vite/esbuild does the actual transpile, vue-tsc the type check).", "python_analogy": "A tsconfig — the type-checker's settings, analogous to mypy.ini for TS.", "key_snippet": {"start": 2, "end": 21, "code": "  \"compilerOptions\": {\n    \"target\": \"ESNext\",\n    \"useDefineForClassFields\": true,\n    \"module\": \"ESNext\",\n    \"moduleResolution\": \"Bundler\",\n    \"strict\": true,\n    \"jsx\": \"preserve\",\n    \"resolveJsonModule\": true,\n    \"isolatedModules\": true,\n    \"esModuleInterop\": true,\n    \"lib\": [\"ESNext\", \"DOM\", \"DOM.Iterable\"],\n    \"skipLibCheck\": true,\n    \"noEmit\": true,\n    \"types\": [\"node\"],\n    \"baseUrl\": \".\",\n    \"paths\": {\n      \"@/*\": [\"./src/*\"]\n    }\n  },\n  \"include\": [\"src/**/*.ts\", \"src/**/*.d.ts\", \"src/**/*.vue\", \"env.d.ts\", \"vite.config.ts\"]"}, "imports": [], "imported_by": []}, {"path": "qaai/web/index.html", "language": "html", "role": "SPA HTML entry (mount point + module script)", "explanation": "The Vite index.html: preloads fonts, declares the #app mount div, and loads src/main.ts as a module. Everything else is rendered by Vue.", "python_analogy": "The single static HTML shell of an SPA — one <div id=app> and a script tag.", "key_snippet": {"start": 13, "end": 16, "code": "  <body>\n    <div id=\"app\"><\/div>\n    <script type=\"module\" src=\"/src/main.ts\"><\/script>\n  <\/body>"}, "imports": ["qaai/web/src/main.ts"], "imported_by": []}, {"path": "qaai/web/README.md", "language": "markdown", "role": "Frontend developer guide (dev/build, architecture, RBAC)", "explanation": "Explains prerequisites, the two-server dev flow (FastAPI + Vite proxy), the production build served by FastAPI, the src/ architecture map, and the RBAC model + relevant env vars.", "python_analogy": "A README documenting how to run and reason about the SPA.", "key_snippet": {"start": 43, "end": 59, "code": "```\nsrc/\n  main.ts              app bootstrap (pinia + router + global styles)\n  App.vue              shell: AppHeader / <router-view> / AppFooter\n  router/index.ts      hash-mode router + role guard (beforeEach)\n  api/\n    client.ts          ROOT_PATH (detectRootPath — proxy base), fetch wrapper, auth-header seam\n    reviews.ts         submit / poll / result / cancel / feedback-upload\n  stores/\n    auth.ts            identity + roles (GET /api/v1/me); hasRole() / can()\n    job.ts             async review engine: 202 → poll → download-blob; AbortController cancel\n  constants.ts         POLL_INTERVAL_MS, MAX_POLL_MS, ROLE_PERMISSIONS, tooltip copy\n  types.ts             Role, Permission, JobStatus, BaselineReviewRequest, …\n  views/               ReviewHome, Unauthorized\n  components/          ReviewerSelector, ReviewerCard, forms/*, controls/*, status/*\n  styles/              tokens.css (theme vars) · base.css (reset/layout/keyframes) · forms.css (form primitives)\n```"}, "imports": [], "imported_by": []}, {"path": "scripts/startup.sh", "language": "bash", "role": "Server launcher (JupyterHub vs local detection)", "explanation": "Configures JupyterServer timeouts, loads .env, and starts uvicorn with the right --root-path when running under JupyterHub (JupyterLab vs VSCode proxy paths) or the local qaai-api entry otherwise.", "python_analogy": "A bash bootstrap script — like an entrypoint.sh that prepares the environment and execs the server.", "key_snippet": {"start": 55, "end": 80, "code": "# Detect if running on JupyterHub\nif [ -n \"$JUPYTERHUB_USER\" ]; then\n    echo \"🚀 Detected JupyterHub environment\"\n    echo \"   User: $JUPYTERHUB_USER\"\n    \n    # Check if we're in VSCode or regular Jupyter\n    if [ -n \"$VSCODE_PROXY_URI\" ]; then\n        ROOT_PATH=\"/user/$JUPYTERHUB_USER/vscode/proxy/8000\"\n        echo \"   Environment: VSCode\"\n    else\n        ROOT_PATH=\"/user/$JUPYTERHUB_USER/proxy/8000\"\n        echo \"   Environment: JupyterLab\"\n    fi\n    \n    echo \"   Root path: $ROOT_PATH\"\n    echo \"\"\n    echo \"📍 Access your API at:\"\n    echo \"   - Root:   https://aihub-ohio.aws.baxter.com${ROOT_PATH}/\"\n    echo \"   - Docs:   https://aihub-ohio.aws.baxter.com${ROOT_PATH}/docs\"\n    echo \"   - Health: https://aihub-ohio.aws.baxter.com${ROOT_PATH}/health\"\n    echo \"\"\n    \n    # --timeout-keep-alive 600 matches the local path (qaai.api.run); reviews\n    # run async (202 + poll) so requests are short, but keep the generous\n    # keep-alive for the polling connections.\n    uv run uvicorn qaai.api.main:app --host 0.0.0.0 --port 8000 --root-path \"$ROOT_PATH\" --timeout-keep-alive 600"}, "imports": [], "imported_by": []}, {"path": "scripts/startup.ps1", "language": "powershell", "role": "Windows local server launcher", "explanation": "Parses .env into the process environment and starts uvicorn with --reload for local Windows development.", "python_analogy": "The PowerShell twin of the local branch of startup.sh.", "key_snippet": {"start": 5, "end": 21, "code": "# Load environment variables from .env file if it exists\nif (Test-Path \".env\") {\n    Write-Host \"[+] Loading environment variables from .env...\"\n    \n    # Parse and set environment variables\n    Get-Content \".env\" | Where-Object { $_ -match '^\\s*[^#]' } | ForEach-Object {\n        $name, $value = $_.Split('=', 2)\n        if ($name -and $value) {\n            $name = $name.Trim()\n            $value = $value.Trim()\n            # Strip surrounding quotes if present\n            if (($value.StartsWith('\"') -and $value.EndsWith('\"')) -or ($value.StartsWith(\"'\") -and $value.EndsWith(\"'\"))) {\n                $value = $value.Substring(1, $value.Length - 2)\n            }\n            [Environment]::SetEnvironmentVariable($name, $value, \"Process\")\n        }\n    }"}, "imports": [], "imported_by": []}, {"path": "scripts/pyjama_subtree.ps1", "language": "powershell", "role": "Sync vendored pyjama via git subtree (pull/push) — Windows", "explanation": "Wraps `git subtree pull/push` for libs/pyjama against the upstream pyjama-fastapi repo, guarding a clean working tree on pull and adding the remote idempotently.", "python_analogy": "A dev-ops helper script wrapping git subtree — like a Makefile target for vendoring a dependency.", "key_snippet": {"start": 40, "end": 47, "code": "switch ($Action) {\n  # --squash matches how the subtree was added; keep it consistent on every pull.\n  \"pull\" { git subtree pull --prefix=$Prefix $Remote $Branch --squash }\n  \"push\" { git subtree push --prefix=$Prefix $Remote $Branch }\n}\nif ($LASTEXITCODE -ne 0) { throw \"git subtree $Action failed (exit $LASTEXITCODE).\" }\n\nWrite-Host \"pyjama subtree $Action complete (prefix $Prefix, remote $Remote, branch $Branch).\""}, "imports": [], "imported_by": []}, {"path": "scripts/pyjama_subtree.sh", "language": "bash", "role": "Sync vendored pyjama via git subtree (pull/push) — POSIX", "explanation": "The bash twin of the .ps1: pull/push libs/pyjama against upstream pyjama-fastapi via git subtree with the same clean-tree guard.", "python_analogy": "The POSIX version of the vendoring helper.", "key_snippet": {"start": 40, "end": 47, "code": "\ncase \"$action\" in\n  # --squash matches how the subtree was added; keep it consistent on every pull.\n  pull) git subtree pull --prefix=\"$prefix\" \"$remote\" \"$branch\" --squash ;;\n  push) git subtree push --prefix=\"$prefix\" \"$remote\" \"$branch\" ;;\nesac\n\necho \"pyjama subtree $action complete (prefix $prefix, remote $remote, branch $branch).\""}, "imports": [], "imported_by": []}, {"path": "pyproject.toml", "language": "toml", "role": "Project manifest (deps, pytest, uv sources, entry point)", "explanation": "The uv/hatchling project file: runtime deps (langgraph, pydantic, fastapi, pandas, and the vendored editable pyjama), the aws optional extra, the dev group (mlflow/pytest/scikit-learn), pytest config (asyncio_mode=auto + integration/unit markers), and the qaai-api script.", "python_analogy": "The Python project manifest — dependencies, test config, and console-script entry points in one TOML.", "key_snippet": {"start": 49, "end": 66, "code": "[tool.pytest.ini_options]\nasyncio_mode = \"auto\"\nmarkers = [\n    \"integration: marks tests that make real LLM API calls (deselect with -m 'not integration')\",\n    \"unit: marks fast unit tests with no live LLM calls (select with -m unit)\",\n]\ntestpaths = [\"tests\"]\npython_classes = []\n\n[tool.uv.sources]\n# pyjama is vendored locally at libs/pyjama (a git subtree of pyjama-fastapi) and installed\n# as an editable path dependency, so edits under libs/pyjama take effect without reinstall.\n# Sync with the standalone repo via: scripts/pyjama_subtree.ps1 pull|push  (.sh on POSIX).\npyjama = { path = \"libs/pyjama\", editable = true }\n\n[project.scripts]\nqaai-api = \"qaai.api.run:main\"\n"}, "imports": [], "imported_by": []}, {"path": "README.md", "language": "markdown", "role": "Project overview + API usage guide", "explanation": "The top-level README: what QAAI is, the three reviewer rubrics, per-reviewer pipeline architecture and output-field reference, getting-started/install, the asynchronous job flow, and the full endpoint reference with curl examples.", "python_analogy": "The front-door documentation for the repo.", "key_snippet": {"start": 7, "end": 15, "code": "QAAI exposes three complementary reviewers, each implemented as an independent LangGraph pipeline that emits a structured, SoP-gating rubric:\n\n| Reviewer                                                          | What it scores                                                                       | Output rubric                                                                                                                                                                                                  |\n| ---------------------------------------------------------------- | ------------------------------------------------------------------------------------ | -------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| **Test Suite Reviewer (RTM)** — `POST /api/v1/test-suite-review` | One requirement against its associated test suite                                    | M1-M5 mandatory findings (Functional / Negative / Boundary / Spec Coverage / Terminology) + R6 advisory (Design Alignment) → binary Yes/No coverage verdict                                                    |\n| **Test Case Reviewer** — `POST /api/v1/test-case-review`         | One test case against its requirements and a checklist of review objectives          | Five review objectives (4 mandatory + 1 advisory), each with a Yes/No verdict and a `partial` flag for material gaps → binary Yes/No overall verdict                                                            |\n| **Hazard Risk Reviewer** — `POST /api/v1/hazard-risk-review`     | One hazard register entry against its traced requirements + test cases + design docs | H1-H6 mandatory findings (Hazard Record Completeness / Software Contribution / Pre-Mitigation Risk / Risk Control Adequacy / Verification Depth / Residual Risk Closure) + R7 recommended (HSHA Update, non-gating) → binary Yes/No verdict  |\n\nAll three reviewers cite the artifact IDs that support each finding, return short comments clarifying any gaps, and emit closed-ended clarification questions so reviewers can quickly confirm whether flagged gaps are real or N/A in context."}, "imports": [], "imported_by": []}, {"path": "CLAUDE.md", "language": "markdown", "role": "Repo guidance for Claude Code (architecture cheat-sheet)", "explanation": "The instructions file loaded into Claude Code sessions: the reviewer/endpoint/rubric table, common uv/pytest commands, the canonical four-file reviewer layout, shared base-node classes, the three graph topologies, the API/cache/prompt subsystems, and conventions worth knowing.", "python_analogy": "A CONTRIBUTING/AGENTS-style doc — a dense architecture cheat-sheet, here consumed by the AI assistant.", "key_snippet": {"start": 5, "end": 10, "code": "## What this is\n\nQAAI is an AI-assisted Design History File (DHF) reviewer for medical-device software (FDA / IEC 62304 / ISO 14971). It exposes three independent **LangGraph reviewer pipelines**, each emitting a structured, SoP-gating rubric with a binary Yes/No verdict:\n\n| Reviewer | Package | Endpoint | Rubric |\n|----------|---------|----------|--------|"}, "imports": [], "imported_by": []}]</script>
<script>
const FILES = JSON.parse(document.getElementById("FILES-DATA").textContent);

function buildTree(files) {
  const root = {};
  files.forEach(f => {
    const parts = f.path.split('/');
    let node = root;
    parts.forEach((p, i) => {
      if (!node[p]) node[p] = i === parts.length - 1 ? null : {};
      if (i < parts.length - 1) node = node[p];
    });
  });
  return root;
}

function renderTree(node, prefix, container) {
  Object.keys(node).sort((a, b) => {
    const aIsDir = node[a] !== null;
    const bIsDir = node[b] !== null;
    if (aIsDir !== bIsDir) return bIsDir ? 1 : -1;
    return a.localeCompare(b);
  }).forEach(key => {
    const fullPath = prefix ? prefix + '/' + key : key;
    if (node[key] === null) {
      const btn = document.createElement('button');
      btn.className = 'file-btn';
      btn.dataset.path = fullPath;
      btn.textContent = key;
      btn.title = fullPath;
      btn.onclick = () => showFile(fullPath);
      container.appendChild(btn);
    } else {
      const row = document.createElement('div');
      row.className = 'folder-row';
      const toggle = document.createElement('span');
      toggle.className = 'folder-toggle open';
      toggle.textContent = '▶';
      row.appendChild(toggle);
      row.appendChild(document.createTextNode(' \u{1F4C1} ' + key));
      const children = document.createElement('div');
      children.className = 'folder-children open';
      row.onclick = () => {
        const open = children.classList.toggle('open');
        toggle.classList.toggle('open', open);
      };
      container.appendChild(row);
      container.appendChild(children);
      renderTree(node[key], fullPath, children);
    }
  });
}

function highlight(code, lang) {
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const rules = [
    [/\/\/[^\n]*/g,                          'tok-comment'],
    [/\/\*[\s\S]*?\*\//g,                    'tok-comment'],
    [/#[^\n]*/g,                             'tok-comment'],
    [/"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|`(?:\\.|[^`\\])*`/g, 'tok-string'],
    [/\b(import|export|from|const|let|var|function|return|if|else|for|while|class|extends|interface|type|enum|async|await|new|this|typeof|keyof|readonly|default|true|false|null|undefined|void|def|lambda|yield|pass|with|as|is|not|and|or|in|del|global|nonlocal|raise|try|except|finally)\b/g, 'tok-keyword'],
    [/@\w+/g,                                'tok-decorator'],
    [/\b([A-Z][A-Za-z0-9]*)\b/g,            'tok-type'],
    [/\b\d+(\.\d+)?\b/g,                    'tok-number'],
    [/\b([a-z_]\w*)\s*(?=\()/g,             'tok-function'],
  ];
  const segments = [{ text: code, cls: null }];
  function applySeg(segs, re, cls) {
    const out = [];
    segs.forEach(seg => {
      if (seg.cls) { out.push(seg); return; }
      let last = 0, m;
      re.lastIndex = 0;
      const text = seg.text;
      while ((m = re.exec(text)) !== null) {
        if (m.index > last) out.push({ text: text.slice(last, m.index), cls: null });
        out.push({ text: m[0], cls });
        last = re.lastIndex;
      }
      if (last < text.length) out.push({ text: text.slice(last), cls: null });
    });
    return out;
  }
  let segs = [{ text: code, cls: null }];
  rules.forEach(([re, cls]) => { segs = applySeg(segs, re, cls); });
  return segs.map(s => s.cls
    ? `<span class="${s.cls}">${esc(s.text)}</span>`
    : esc(s.text)
  ).join('');
}

function showFile(path) {
  const f = FILES.find(x => x.path === path);
  if (!f) return;

  document.querySelectorAll('.file-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.path === path));

  const chips = (arr, label) => {
    if (!arr || !arr.length) return `<div class="chips"><span class="chip none">${label}</span></div>`;
    return '<div class="chips">' +
      arr.map(p => `<button class="chip" onclick="showFile('${p.replace(/'/g,"\\'")}')">\u{1F4C4} ${p}</button>`).join('') +
      '</div>';
  };

  const snippet = f.key_snippet
    ? `<div class="snippet-wrap"><pre>${highlight(f.key_snippet.code, f.language)}</pre></div>`
    : '<p style="color:var(--muted)">No snippet available.</p>';

  document.getElementById('panel').innerHTML = `
    <span class="file-path">\u{1F4C4} ${f.path}</span>
    <div class="role-label">${f.role}</div>

    <div class="section-title">What it does</div>
    <p class="explanation">${f.explanation}</p>

    <div class="section-title">\u{1F40D} Python analogy</div>
    <div class="python-box"><strong>Python:</strong> ${f.python_analogy}</div>

    <div class="section-title">Key snippet (lines ${f.key_snippet ? f.key_snippet.start + '–' + f.key_snippet.end : '—'})</div>
    ${snippet}

    <div class="section-title">Imports from</div>
    ${chips(f.imports, 'no local imports')}

    <div class="section-title">Imported by</div>
    ${chips(f.imported_by, 'nothing imports this directly')}
  `;
}

document.getElementById('search').addEventListener('input', function() {
  const q = this.value.toLowerCase();
  document.querySelectorAll('.file-btn').forEach(b => {
    b.classList.toggle('hidden', q && !b.dataset.path.toLowerCase().includes(q));
  });
});

const tree = buildTree(FILES);
renderTree(tree, '', document.getElementById('tree'));
document.getElementById('file-count').textContent = FILES.length + ' files';

const entry = FILES.find(f => f.path === "qaai/api/main.py")
  || FILES.find(f => /\/(main|index)\.[a-z]+$/.test(f.path))
  || FILES[0];
if (entry) showFile(entry.path);
</script>
