<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Codebase Explorer — QAAI</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d1117; --sidebar: #161b22; --panel: #1a2030;
  --accent: #58a6ff; --text: #c9d1d9; --muted: #8b949e;
  --chip-bg: #21262d; --python-box: rgba(88,166,255,.08);
  --border: #30363d; --snippet-bg: #0d1117;
  --font: 'Courier New', Courier, monospace;
}
body { background: var(--bg); color: var(--text); font-family: var(--font);
       font-size: 13px; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
header { padding: 10px 16px; border-bottom: 1px solid var(--border);
         display: flex; align-items: center; gap: 12px; flex-shrink: 0; background: var(--sidebar); }
header h1 { font-size: 15px; color: var(--accent); letter-spacing: 1px; }
header span { color: var(--muted); font-size: 11px; }
#file-count { margin-left: auto; color: var(--muted); font-size: 11px; }
main { display: flex; flex: 1; overflow: hidden; }
#sidebar { width: 300px; min-width: 200px; background: var(--sidebar);
           border-right: 1px solid var(--border); display: flex;
           flex-direction: column; overflow: hidden; resize: horizontal; }
#search { margin: 8px; padding: 6px 8px; background: var(--bg);
          border: 1px solid var(--border); color: var(--text); border-radius: 4px;
          font-family: var(--font); font-size: 12px; width: calc(100% - 16px); }
#search:focus { outline: none; border-color: var(--accent); }
#tree { flex: 1; overflow-y: auto; padding-bottom: 12px; }
.folder-row { display: flex; align-items: center; padding: 4px 8px;
              cursor: pointer; user-select: none; color: var(--muted);
              font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
.folder-row:hover { color: var(--text); }
.folder-toggle { margin-right: 4px; display: inline-block; transition: transform .15s; }
.folder-toggle.open { transform: rotate(90deg); }
.folder-children { display: none; }
.folder-children.open { display: block; }
.file-btn { display: block; width: 100%; text-align: left; padding: 5px 8px 5px 20px;
            background: none; border: none; color: var(--text); font-family: var(--font);
            font-size: 12px; cursor: pointer; border-left: 2px solid transparent;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file-btn:hover { background: rgba(88,166,255,.06); color: var(--accent); }
.file-btn.active { border-left-color: var(--accent); color: var(--accent);
                   background: rgba(88,166,255,.10); }
.file-btn.hidden { display: none; }
#panel { flex: 1; overflow-y: auto; padding: 24px 28px; background: var(--panel); }
#panel .placeholder { color: var(--muted); margin-top: 40px; text-align: center; font-size: 13px; }
.file-path { font-size: 11px; color: var(--muted); background: var(--chip-bg);
             padding: 3px 8px; border-radius: 3px; display: inline-block; margin-bottom: 14px; }
.role-label { font-size: 16px; color: var(--accent); margin-bottom: 14px; font-weight: bold; }
.section-title { font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
                 color: var(--muted); margin-bottom: 6px; margin-top: 18px; }
.explanation { line-height: 1.7; color: var(--text); margin-bottom: 4px; }
.python-box { background: var(--python-box); border-left: 3px solid var(--accent);
              padding: 10px 14px; border-radius: 0 4px 4px 0; margin: 4px 0;
              line-height: 1.6; }
.python-box strong { color: var(--accent); }
.snippet-wrap { background: var(--snippet-bg); border: 1px solid var(--border);
                border-radius: 4px; overflow-x: auto; margin: 4px 0; }
.snippet-wrap pre { padding: 14px; font-size: 12px; line-height: 1.6;
                    font-family: var(--font); white-space: pre; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0; }
.chip { background: var(--chip-bg); border: 1px solid var(--border); border-radius: 3px;
        padding: 3px 8px; font-size: 11px; cursor: pointer; color: var(--text); }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip.none { cursor: default; color: var(--muted); border-color: transparent; }
.tok-keyword  { color: #c792ea; }
.tok-string   { color: #c3e88d; }
.tok-comment  { color: #546e7a; font-style: italic; }
.tok-function { color: #82aaff; }
.tok-number   { color: #f78c6c; }
.tok-type     { color: #ffcb6b; }
.tok-decorator{ color: #89ddff; }
</style>
</head>
<body>

<header>
  <h1>&#x25A0; QAAI</h1>
  <span>Codebase Explorer</span>
  <span id="file-count"></span>
</header>

<main>
  <div id="sidebar">
    <input id="search" type="search" placeholder="&#x1F50D; filter files..." />
    <div id="tree"></div>
  </div>
  <div id="panel">
    <p class="placeholder">&#x2190; Select a file to read its explanation</p>
  </div>
</main>

<script type="application/json" id="FILES-DATA">[{"path": "qaai/utils.py", "language": "python", "role": "Jinja2 prompt rendering + Mermaid graph-PNG helpers", "explanation": "Central utilities shared everywhere. render_prompt(path, **vars) loads a Jinja2 template from qaai/prompts and renders it into a node's system prompt; render_graph_png()/write_graph_png_bytes() turn a compiled LangGraph into a diagram written per run. Prompt loading is anchored to the prompts dir relative to this file.", "python_analogy": "Like a small helpers.py that wraps jinja2.Environment plus a to_png() for a graph object — the one import every node reaches for.", "key_snippet": {"start": 76, "end": 91, "code": "def render_prompt(template_name: str, **kwargs: Any) -> str:\n    \"\"\"\n    Load and render a prompt template with the given variables.\n    \n    Args:\n        template_name: Name of the template file (e.g., 'decomposer.jinja2')\n        **kwargs: Variables to pass to the template\n        \n    Returns:\n        str: Rendered prompt text\n        \n    Example:\n        >>> prompt = render_prompt('decomposer.jinja2', domain='medical devices')\n    \"\"\"\n    template = load_prompt_template(template_name)\n    return template.render(**kwargs)"}, "imports": [], "imported_by": ["qaai/agents/shared/nodes.py", "qaai/agents/test_suite_reviewer/pipeline.py", "qaai/agents/test_case_reviewer/pipeline.py", "qaai/agents/hazard_risk_reviewer/pipeline.py"]}, {"path": "qaai/core/config.py", "language": "python", "role": "Pydantic Settings singleton + PromptConfig (node→template map)", "explanation": "Defines PromptConfig (maps ~19 node roles to versioned Jinja2 template paths, resolvable from a named set via from_set()) and Settings (env-driven singleton: API creds, rate limits, token costs, cache dir, RBAC roles). The module-level `settings` object is imported across the codebase; in TEST/PROD it hydrates secrets from AWS before pydantic validates.", "python_analogy": "A pydantic-settings BaseSettings singleton — like a Django settings.py you import once (from qaai.core.config import settings) instead of threading config through every call.", "key_snippet": {"start": 58, "end": 82, "code": "    # Test Suite Reviewer prompts\n    decomposer: str = \"decomposer/v6.0.0/template.jinja2\"\n    summarizer: str = \"summarizer/v4.0.0/template.jinja2\"\n    design_summarizer: str = \"design_summarizer/v1.0.0/template.jinja2\"\n    coverage: str = \"coverage_evaluator/v8.0.0/template.jinja2\"\n    synthesizer: str = \"synthesizer/v8.0.0/template.jinja2\"\n    \n    # Test Case Reviewer prompts (aggregator embeds the review objectives directly;\n    # v8 = decomposition variant, v9 = no-decomposition variant)\n    single_test_aggregator: str = \"single_test_aggregator/v9.0.0/template.jinja2\"\n    single_test_coverage_eval: str = \"single_test_coverage_eval/v4.0.0/template.jinja2\"\n    single_test_logical_steps: str = \"single_test_logical_steps/v3.0.0/template.jinja2\"\n    single_test_prereqs: str = \"single_test_prereqs/v3.0.0/template.jinja2\"\n    \n    # Hazard reviewer prompts (H1-H6 mandatory + R7 recommended + final assessor)\n    hazard_h1: str = \"hazard_h1/v5.0.0/template.jinja2\"\n    hazard_h2: str = \"hazard_h2/v2.0.0/template.jinja2\"\n    hazard_h3: str = \"hazard_h3/v5.0.0/template.jinja2\"\n    hazard_h4: str = \"hazard_h4/v1.0.0/template.jinja2\"\n    hazard_h5: str = \"hazard_h5/v1.0.0/template.jinja2\"\n    hazard_h6: str = \"hazard_h6/v2.0.0/template.jinja2\"\n    hazard_r7: str = \"hazard_r7/v1.0.0/template.jinja2\"\n    hazard_final: str = \"hazard_final_assessor/v1.0.0/template.jinja2\"\n    hazard_design_summarizer: str = \"hazard_design_summarizer/v1.0.0/template.jinja2\"\n    hazard_needs_summarizer: str = \"hazard_needs_summarizer/v1.0.0/template.jinja2\""}, "imports": ["qaai/core/constants.py", "qaai/prompts/_registry.py", "qaai/core/secrets.py"], "imported_by": ["qaai/agents/shared/nodes.py", "qaai/api/main.py", "qaai/api/services.py", "qaai/core/telemetry.py"]}, {"path": "qaai/core/cache.py", "language": "python", "role": "3-tier write-through review cache (Redis + immutable timestamped disk)", "explanation": "ReviewCacheManager is the regulatory-evidence cache shared by all three reviewers. Reads check Redis (Tier 2, optional) then the newest timestamped disk JSON (Tier 3); writes append a new immutable {node}_{version}_{ts}.json file so a full history survives. Keys partition by entity id (REQ-*/TEST-*/HAZ-*), node, prompt version, and optional prompt set; purge_run() drops only one run's files by timestamp.", "python_analogy": "A hand-rolled cache like functools.lru_cache but persisted to versioned files on disk with an optional Redis front — every write is a new file, never an overwrite, so you keep an audit trail.", "key_snippet": {"start": 223, "end": 247, "code": "        payload = {\n            \"result\": result_dict,\n            \"meta\": {\n                \"entity_id\": entity_id,\n                \"node\": node_name,\n                \"prompt_version\": prompt_version,\n                \"prompt_set\": prompt_set,\n                \"model\": model,\n                \"prompt_tokens\": prompt_tokens,\n                \"completion_tokens\": completion_tokens,\n                \"ts\": datetime.now(timezone.utc).isoformat(),\n                \"cache_tier_origin\": 3,\n            },\n        }\n        raw = json.dumps(payload, indent=2, default=str)\n\n        # Write to Disk (Tier 3) — a NEW timestamped file; never overwrite history.\n        disk_path = self._new_file_path(entity_id, node_name, prompt_version, prompt_set)\n        try:\n            disk_path.parent.mkdir(parents=True, exist_ok=True)\n            disk_path.write_text(raw, encoding=\"utf-8\")\n            logger.debug(\"Cache WRITE (disk): %s\", disk_path)\n        except Exception as e:\n            logger.warning(\"ReviewCacheManager: disk write failed — %s\", e)\n"}, "imports": ["qaai/core/telemetry.py"], "imported_by": ["qaai/agents/shared/nodes.py", "qaai/api/main.py", "qaai/api/services.py", "qaai/agents/hazard_risk_reviewer/pipeline.py"]}, {"path": "qaai/core/telemetry.py", "language": "python", "role": "Per-call token/cost + cache-hit telemetry to token_usage.jsonl", "explanation": "TokenUsageTracker appends one JSON record per LLM call (tokens, cost) and per cache hit/miss to token_usage.jsonl, and writes a summary at teardown. It is injected into the LLM client and the cache manager; when file_path is None it re-resolves the path from settings each write so per-run folders capture their own telemetry.", "python_analogy": "A metrics collector like a statsd client, but it just appends dicts to a JSONL file and keeps running totals in memory.", "key_snippet": {"start": 84, "end": 101, "code": "    async def record(self, prompt_tokens: int, completion_tokens: int, model: str) -> None:\n        \"\"\"Append one per-call record and update running totals.\"\"\"\n        self._total_prompt_tokens += prompt_tokens\n        self._total_completion_tokens += completion_tokens\n        self._call_count += 1\n\n        entry = {\n            \"ts\": datetime.now(timezone.utc).isoformat(),\n            \"model\": model,\n            \"prompt_tokens\": prompt_tokens,\n            \"completion_tokens\": completion_tokens,\n            \"total_tokens\": prompt_tokens + completion_tokens,\n            \"cost_usd\": self._calculate_cost(prompt_tokens, completion_tokens),\n        }\n        try:\n            with open(self.file_path, \"a\", encoding=\"utf-8\") as f:\n                f.write(json.dumps(entry) + \"\\n\")\n        except Exception as e:"}, "imports": ["qaai/core/constants.py"], "imported_by": ["qaai/agents/clients.py", "qaai/core/cache.py", "qaai/api/main.py"]}, {"path": "qaai/core/constants.py", "language": "python", "role": "Tunable defaults + run-artifact filenames + ErrorCode enum", "explanation": "One place for the magic numbers: rate-limit ceilings, batch sizes, retry/backoff parameters, token-cost defaults (Claude Haiku 4.5 basis), validation limits, and the inputs/outputs/token_usage JSONL filenames. Also holds the ErrorCode string constants used in API/error handling.", "python_analogy": "A constants.py of module-level ALL_CAPS values — the settings defaults and enums live here so config.py just wires them to env-var names.", "key_snippet": {"start": 11, "end": 29, "code": "\nDEFAULT_MAX_REQUESTS_PER_MINUTE = 5000\n\"\"\"Default maximum API requests per minute.\n\nProvides headroom under a high-tier RPM limit. Adjust based on your API tier\nand account limits.\n\"\"\"\n\nDEFAULT_MAX_TOKENS_PER_MINUTE = 5_000_000\n\"\"\"Default maximum tokens per minute across all requests.\n\nCheck your account's TPM limit and adjust accordingly.\n\"\"\"\n\nDEFAULT_MAX_OUTPUT_TOKENS = 16_000\n\"\"\"Default maximum output tokens per single request.\n\n16K output tokens lets the summarizer process 100+ test cases without truncation.\n\"\"\""}, "imports": [], "imported_by": ["qaai/core/config.py", "qaai/core/telemetry.py", "qaai/agents/clients.py", "qaai/agents/shared/data_integration.py"]}, {"path": "qaai/core/logging_config.py", "language": "python", "role": "Per-run timestamped log folders + re-pointable file handlers", "explanation": "Owns the logs/run-<ts>/ convention. start_new_run() creates a fresh folder and re-points the api.log / qaai.log / pyjama.log handlers into it (idempotently detaching old handlers) and updates settings.log_file_path so services and telemetry write into the same folder. Called once at boot (console-only) and again at the start of every review request.", "python_analogy": "Like logging.config.dictConfig, but re-invoked per request to swap the FileHandler targets to a new timestamped directory each run.", "key_snippet": {"start": 253, "end": 278, "code": "def start_new_run(base_logs_dir: str | None = None) -> Path:\n    \"\"\"Begin a fresh run: create a timestamped directory and re-point all logging.\n\n    Called at the start of every review request (and once per integration-test\n    session), so each run gets its own ``logs/run-<ts>/`` holding that run's\n    ``api.log`` / ``qaai.log`` / ``pyjama.log`` alongside its ``inputs.jsonl``,\n    ``outputs.jsonl``, viewer, graph png and ``token_usage.jsonl``. Updates\n    ``settings.log_file_path`` so the services (which derive their output dir and\n    ``telemetry_file_path`` from it) write into the same folder.\n\n    Args:\n        base_logs_dir: Base directory for all run folders. Defaults to\n            ``settings.log_base_dir`` (``./logs`` in production, ``./logs/tests``\n            under the test harness).\n\n    Returns:\n        Path to the new run directory.\n    \"\"\"\n    from qaai.core.config import settings\n\n    if base_logs_dir is None:\n        base_logs_dir = settings.log_base_dir\n\n    run_dir = create_timestamped_run_directory(base_logs_dir)\n    setup_logging(run_dir)\n"}, "imports": ["qaai/core/config.py"], "imported_by": ["qaai/api/main.py", "qaai/api/services.py"]}, {"path": "qaai/core/secrets.py", "language": "python", "role": "Pluggable env/secret retrieval (dotenv / AWS Secrets Manager / SSM)", "explanation": "EnvVariableRetriever abstracts where secrets come from behind load()/hydrate_environment(): local .env (optionally prefixed to mimic PROD_ locally), AWS Secrets Manager, SSM Parameter Store, or Lambda env. boto3 is imported lazily so it stays an AWS-only optional dependency. Settings calls this before pydantic validates in TEST/PROD.", "python_analogy": "A strategy pattern for os.environ hydration — swap the backend (dotenv vs boto3) without touching the fields that read the values.", "key_snippet": {"start": 78, "end": 111, "code": "    @classmethod\n    def for_environment(cls, app_env: str) -> \"EnvVariableRetriever\":\n        \"\"\"Build a retriever appropriate for the active environment.\n\n        ``DEV`` → plain ``dotenv`` (no prefix): behaves like today's ``.env`` flow.\n        ``TEST`` / ``PROD`` → AWS Secrets Manager when a secret id is configured\n        (``QAAI_SECRET_ID``), otherwise a prefixed ``dotenv`` retriever\n        (``PROD_``/``TEST_``) so the AWS flow can be exercised locally.\n\n        The secret id and region are read from the environment so deployment config\n        (task definition / Lambda env) drives them without code changes.\n        \"\"\"\n        env = (app_env or \"DEV\").upper()\n        if env == \"DEV\":\n            return cls(SOURCE_DOTENV)\n\n        secret_id = os.getenv(\"QAAI_SECRET_ID\")\n        region_name = os.getenv(\"AWS_REGION\") or os.getenv(\"AWS_DEFAULT_REGION\")\n        if secret_id:\n            return cls(\n                SOURCE_SECRETS_MANAGER,\n                secret_id=secret_id,\n                region_name=region_name,\n            )\n\n        # Local mimic: no AWS secret configured, fall back to prefixed env vars\n        # (e.g. PROD_API_KEY) so a single .env can stand in for the secret store.\n        logger.info(\n            \"EnvVariableRetriever: no QAAI_SECRET_ID set for %s — using prefixed \"\n            \"dotenv mimic (%s_*)\",\n            env,\n            env,\n        )\n        return cls(SOURCE_DOTENV, prefix=f\"{env}_\")"}, "imports": [], "imported_by": ["qaai/core/config.py"]}, {"path": "qaai/agents/clients.py", "language": "python", "role": "Rate-limited AsyncOpenAI client (RPM/TPM limiting + backoff)", "explanation": "RateLimitOpenAIClient wraps AsyncOpenAI with proactive RPM (OpenAIRateLimiter) and TPM (OpenAITokenLimiter) throttling using rolling 60s windows, reactive exponential-backoff retries that honor server reset headers, and telemetry recording. Any OpenAI-compatible endpoint works (OpenAI / Ollama / vLLM / Bedrock).", "python_analogy": "A wrapper around the openai AsyncOpenAI client that adds a token bucket + tenacity-style retry — the single chokepoint every LLM call flows through.", "key_snippet": {"start": 352, "end": 381, "code": "    async def chat_completion(self, model: str, messages: list, **kwargs) -> ChatCompletion:\n        \"\"\"Make a chat completion request with RPM/TPM limiting and token-aware retries.\"\"\"\n        await self.rate_limiter.wait_if_needed()\n\n        est_tokens = 0\n        if self.token_limiter:\n            est_tokens = self._estimate_total_tokens(model, messages, kwargs)\n            await self.token_limiter.wait_if_needed(est_tokens)\n\n        # Perform the request with token-aware retry/backoff\n        completion: ChatCompletion = await async_retry_with_backoff(\n            self.client.chat.completions.create,\n            model=model,\n            messages=messages,\n            token_limiter=self.token_limiter,\n            est_tokens=est_tokens,\n            **kwargs,\n        )\n\n        # Record actual token usage (if available)\n        usage = getattr(completion, \"usage\", None)\n        if usage is not None:\n            prompt_tokens = getattr(usage, \"prompt_tokens\", 0) or 0\n            completion_tokens = getattr(usage, \"completion_tokens\", 0) or 0\n            total_tokens = getattr(usage, \"total_tokens\", None) or (prompt_tokens + completion_tokens)\n            try:\n                if self.token_limiter and total_tokens:\n                    await self.token_limiter.record(int(total_tokens))\n            except Exception:\n                pass"}, "imports": ["qaai/core/constants.py", "qaai/core/telemetry.py"], "imported_by": ["qaai/agents/shared/nodes.py", "qaai/api/main.py", "qaai/eval/runners.py"]}, {"path": "qaai/agents/shared/__init__.py", "language": "python", "role": "Shared-agent package exports", "explanation": "Re-exports the shared Pydantic models (Requirement, DecomposedSpec, DecomposedRequirement, TestCase) and base node classes (BaseLLMNode, StandardLLMNode, DecomposerNode, make_decomposer_node) so reviewers import them from one place.", "python_analogy": "A package __init__ that curates the public API with __all__ — like re-exporting from a subpackage so callers write `from qaai.agents.shared import StandardLLMNode`.", "key_snippet": {"start": 1, "end": 13, "code": "from .core import Requirement, DecomposedSpec, DecomposedRequirement, TestCase\nfrom .nodes import BaseLLMNode, StandardLLMNode, DecomposerNode, make_decomposer_node\n\n__all__ = [\n    \"Requirement\",\n    \"DecomposedSpec\",\n    \"DecomposedRequirement\",\n    \"TestCase\",\n    \"BaseLLMNode\",\n    \"StandardLLMNode\",\n    \"DecomposerNode\",\n    \"make_decomposer_node\",\n]"}, "imports": ["qaai/agents/shared/core.py", "qaai/agents/shared/nodes.py"], "imported_by": []}, {"path": "qaai/agents/shared/core.py", "language": "python", "role": "Shared Pydantic input models + BaseReviewState", "explanation": "The domain vocabulary used across all three reviewers: Requirement, DecomposedSpec, DecomposedRequirement, DesignDocument, TestCase, plus the Verdict/VerdictNA literals and BaseReviewState (cache_mode + JAMA + input-gate fields inherited by the RTM and TC states).", "python_analogy": "A models.py of pydantic BaseModels plus a TypedDict base — the shared schema every graph state builds on, like a common dataclasses module.", "key_snippet": {"start": 16, "end": 37, "code": "class BaseReviewState(TypedDict, total=False):\n    \"\"\"Cache-control + JAMA-integration fields common to reviewer graph states.\n\n    Inherited by RTMReviewState and TCReviewState (identical field types). The\n    hazard state declares its own narrower types (typed PyJamaRequest, plus a\n    pyjama_test_mode override) so it does not inherit this base.\n    \"\"\"\n    # Caching control: \"off\" | \"on\" (default) | \"test\". Threaded from the\n    # API/service into every node; see qaai.core.cache.ReviewCacheManager.\n    cache_mode: str\n    # JAMA integration fields (Option 2 only)\n    pyjama_request: Optional[Any]  # PyJamaRequest, but avoid import cycle\n    jama_data: Optional[List[Dict[str, Any]]]\n    jama_metadata: Optional[Dict[str, Any]]\n    # Input-gate outcome (see qaai.agents.shared.gate). Set to \"skipped\" with a\n    # populated skip_reason / missing_fields when required inputs are absent and\n    # the graph short-circuits to END before any LLM call. Read per-record by the\n    # viewer to render the missing-fields warning banner.\n    review_status: Optional[str]\n    skip_reason: Optional[str]\n    missing_fields: Optional[List[str]]\n"}, "imports": [], "imported_by": ["qaai/agents/shared/nodes.py", "qaai/agents/test_suite_reviewer/core.py", "qaai/agents/test_case_reviewer/core.py", "qaai/agents/hazard_risk_reviewer/core.py"]}, {"path": "qaai/agents/shared/nodes.py", "language": "python", "role": "Base LLM node engine (Template Method) + JSON repair + cache gating", "explanation": "The heart of the reviewer pattern. BaseLLMNode holds config, robust JSON extraction/repair (markdown fences, bracket balancing, json_repair second pass), and cache read/write gating keyed on state['cache_mode']. StandardLLMNode runs validate→cache-check→build→LLM→parse→cache-write→format; BatchedLLMNode fans batches out via asyncio.gather; DecomposerNode is the reused requirement→specs node.", "python_analogy": "An abstract base class using the Template Method pattern — subclasses fill in _build_payload/_format_response while __call__ orchestrates, much like Django's class-based views.", "key_snippet": {"start": 169, "end": 192, "code": "    @staticmethod\n    def _mode(state: Any) -> str:\n        return (state or {}).get(\"cache_mode\", \"on\")\n\n    def _cache_read_allowed(self, state: Any) -> bool:\n        \"\"\"Whether this node may read from cache for the given state.\"\"\"\n        if self.cache_manager is None or not self.prompt_version:\n            return False\n        mode = self._mode(state)\n        if mode == \"off\":\n            return False\n        if mode == \"on\" and self.is_final_output:\n            return False\n        return True  # \"on\" (interim) and \"test\" (all nodes) may read\n\n    def _cache_write_allowed(self, state: Any) -> bool:\n        \"\"\"Whether this node may write to cache for the given state.\n\n        Both \"off\" and \"on\" persist every node result (as a new timestamped\n        file); \"test\" never writes — it only recreates a report from cache.\n        \"\"\"\n        if self.cache_manager is None or not self.prompt_version:\n            return False\n        return self._mode(state) in (\"off\", \"on\")"}, "imports": ["qaai/agents/clients.py", "qaai/core/config.py", "qaai/utils.py", "qaai/agents/shared/core.py"], "imported_by": ["qaai/agents/test_suite_reviewer/nodes.py", "qaai/agents/test_case_reviewer/nodes.py", "qaai/agents/hazard_risk_reviewer/nodes.py"]}, {"path": "qaai/agents/shared/data_integration.py", "language": "python", "role": "Conditional JAMA fetch vs local pass-through + JAMA→state transforms", "explanation": "DataIntegrationNode is the entry node of every graph: if state has a pyjama_request it fetches from JAMA via PyJama, else it is a no-op (data already in state, as in tests). Also holds the transform functions that coerce raw JAMA responses (and pyjama's own models) into qaai state shapes, and a logging shim so pyjama writes into QAAI's run folder. PyJama import degrades gracefully.", "python_analogy": "An adapter/boundary layer — like a repository that either hits the remote API or returns already-loaded objects, plus DTO-to-model mapping.", "key_snippet": {"start": 258, "end": 285, "code": "        pyjama_request = state.get(\"pyjama_request\")\n\n        if pyjama_request is None:\n            # Local mode: data already in state, no-op\n            logger.debug(\"Local mode: pyjama_request not present, skipping JAMA fetch\")\n            return {}\n\n        # JAMA mode: fetch from baseline. A per-call test_mode override threaded\n        # through graph state (pyjama_test_mode) selects cache-only behaviour.\n        test_mode_override = state.get(\"pyjama_test_mode\")\n        logger.info(\n            \"JAMA mode: fetching data for request_type=%s (test_mode=%s)\",\n            pyjama_request.request_type if hasattr(pyjama_request, 'request_type') else 'unknown',\n            test_mode_override,\n        )\n\n        # Lazy init PyJama node for the effective test_mode, then delegate.\n        pyjama_node = self._get_pyjama_node(test_mode_override)\n        try:\n            result = await pyjama_node(state)\n            logger.info(\n                \"JAMA fetch successful: %d items retrieved\",\n                len(result.get(\"jama_data\", []))\n            )\n            return result\n        except Exception as e:\n            logger.error(\"JAMA fetch failed: %s\", str(e), exc_info=True)\n            raise"}, "imports": ["qaai/core/constants.py", "qaai/core/config.py", "qaai/agents/hazard_risk_reviewer/core.py", "qaai/agents/shared/core.py"], "imported_by": ["qaai/agents/test_suite_reviewer/pipeline.py", "qaai/agents/test_case_reviewer/pipeline.py", "qaai/agents/hazard_risk_reviewer/pipeline.py", "qaai/api/services.py"]}, {"path": "qaai/agents/shared/gate.py", "language": "python", "role": "Input-validation gate node + conditional router", "explanation": "make_validation_gate(validate_fn) builds the validation_gate node that runs right after transform: when required inputs are missing it marks the record skipped (review_status/skip_reason/missing_fields) and make_gate_router short-circuits the graph to END with no LLM calls. Those fields ride into outputs.jsonl and drive the viewer's missing-fields banner.", "python_analogy": "A guard clause factory for the graph — like a decorator that returns early with a 'skipped' result instead of raising when preconditions fail.", "key_snippet": {"start": 66, "end": 80, "code": "    def validation_gate(state: Dict[str, Any]) -> Dict[str, Any]:\n        missing = validate_fn(state) or []\n        if missing:\n            logger.warning(\n                \"validation_gate: skipping review — missing required inputs: %s\",\n                \", \".join(missing),\n            )\n            return {\n                \"review_status\": SKIP_STATUS,\n                \"skip_reason\": _skip_reason(missing),\n                \"missing_fields\": missing,\n            }\n        return {}\n\n    return validation_gate"}, "imports": [], "imported_by": ["qaai/agents/test_suite_reviewer/pipeline.py", "qaai/agents/test_case_reviewer/pipeline.py", "qaai/agents/hazard_risk_reviewer/pipeline.py"]}, {"path": "qaai/agents/test_suite_reviewer/core.py", "language": "python", "role": "RTM Pydantic output models + RTMReviewState (M1–M5 rubric)", "explanation": "Per-node output models for the RTM reviewer: SummarizedTestCase, SummarizedDesignSpec, TestSuite, EvaluatedSpec (per-spec coverage), MandatoryFinding (M1–M5 + R6 advisory), and SynthesizedAssessment. RTMReviewState is the graph TypedDict whose coverage_analysis fan-in uses Annotated[List[EvaluatedSpec], operator.add].", "python_analogy": "A schema module of pydantic models plus a TypedDict — the operator.add reducer is like a custom merge so parallel writes concatenate instead of clobber.", "key_snippet": {"start": 230, "end": 242, "code": "class RTMReviewState(BaseReviewState, total=False):\n    # cache_mode + JAMA integration fields (pyjama_request / jama_data /\n    # jama_metadata) are inherited from BaseReviewState.\n    # Data source fields (Option 1: local OR Option 2: JAMA)\n    requirement: Requirement\n    test_cases: List[TestCase]\n    # Pipeline state fields\n    design_docs: Optional[List[DesignDocument]]\n    decomposed_requirement: Optional[DecomposedRequirement]\n    test_suite: Optional[TestSuite]\n    summarized_designs: Optional[List[SummarizedDesignSpec]]\n    coverage_analysis: Annotated[List[EvaluatedSpec], operator.add]\n    synthesized_assessment: Optional[SynthesizedAssessment]"}, "imports": ["qaai/agents/shared/core.py"], "imported_by": ["qaai/agents/test_suite_reviewer/nodes.py", "qaai/agents/test_suite_reviewer/pipeline.py", "qaai/agents/hazard_risk_reviewer/core.py"]}, {"path": "qaai/agents/test_suite_reviewer/nodes.py", "language": "python", "role": "RTM nodes: summarizer / design-summarizer / spec-evaluator / synthesizer", "explanation": "Suite-specific nodes plus their make_*_node factories and the dispatch_coverage Send fan-out (one Send per decomposed spec). SummaryNode/DesignSummarizerNode batch, SingleSpecEvaluatorNode scores one spec (cache-keyed per spec_id), and SynthesizerNode aggregates the per-spec verdicts into the M1–M5 assessment (flagged is_final_output).", "python_analogy": "A module of node subclasses + factory functions — dispatch_coverage returns a list of Send objects, the LangGraph equivalent of scattering tasks to asyncio.gather.", "key_snippet": {"start": 164, "end": 190, "code": "def dispatch_coverage(state: RTMReviewState) -> List[Send]:\n    \"\"\"\n    LangGraph Send dispatcher: fans out one Send per decomposed spec so that\n    each spec is evaluated in parallel by SingleSpecEvaluatorNode.\n    Returns an empty list if required state keys are missing (safe no-op).\n    \"\"\"\n    requirement = state.get(\"requirement\")\n    decomposed = state.get(\"decomposed_requirement\")\n    test_suite = state.get(\"test_suite\")\n    if not requirement or not decomposed or not test_suite:\n        logger.warning(\"dispatch_coverage: incomplete state, skipping fan-out\")\n        return []\n    cache_mode = state.get(\"cache_mode\", \"on\")\n    # summarized_designs joined at coverage_router (may be None when a\n    # requirement has no design docs). Send only forwards the keys placed in\n    # this dict, so it must be threaded through explicitly to reach spec_evaluator.\n    summarized_designs = state.get(\"summarized_designs\")\n    return [\n        Send(\"spec_evaluator\", {\n            \"requirement\": requirement,\n            \"decomposed_spec\": spec,\n            \"test_suite\": test_suite,\n            \"summarized_designs\": summarized_designs,\n            \"cache_mode\": cache_mode,\n        })\n        for spec in decomposed.decomposed_specifications\n    ]"}, "imports": ["qaai/agents/shared/nodes.py", "qaai/core/cache.py", "qaai/utils.py", "qaai/agents/test_suite_reviewer/core.py"], "imported_by": ["qaai/agents/test_suite_reviewer/pipeline.py"]}, {"path": "qaai/agents/test_suite_reviewer/pipeline.py", "language": "python", "role": "RTMReviewerRunnable — builds/compiles the RTM StateGraph", "explanation": "Wires the RTM topology: data_integration→transform→validation_gate→[decomposer|summarizer|design_summarizer]→coverage_router→(Send×N) spec_evaluator→synthesizer→END. build() constructs nodes from the prompt config, adds edges/conditional edges, compiles with an optional checkpointer, and caches a graph.png. This compiled graph is also embedded as a subgraph by the hazard reviewer.", "python_analogy": "A builder class whose build() returns a compiled pipeline object — like assembling a DAG and calling .compile(), similar to constructing a Celery canvas.", "key_snippet": {"start": 153, "end": 175, "code": "        # Wire data integration layer\n        sg.add_edge(START, \"data_integration\")\n        sg.add_edge(\"data_integration\", \"transform\")\n\n        # Input gate: skip the graph (no LLM calls) when the requirement has no\n        # text or no traced test cases; otherwise fan out to the work nodes.\n        sg.add_edge(\"transform\", \"validation_gate\")\n        sg.add_conditional_edges(\n            \"validation_gate\",\n            make_gate_router([\"decomposer\", \"summarizer\", \"design_summarizer\"]),\n            [\"decomposer\", \"summarizer\", \"design_summarizer\", END],\n        )\n\n        # Fan-in to coverage_router, then fan-out via Send to N parallel spec evaluators\n        sg.add_edge(\"decomposer\", \"coverage_router\")\n        sg.add_edge(\"summarizer\", \"coverage_router\")\n        sg.add_edge(\"design_summarizer\", \"coverage_router\")\n        sg.add_conditional_edges(\"coverage_router\", dispatch_coverage, [\"spec_evaluator\"])\n\n        # Synthesizer aggregates coverage evaluations (MoA-like pattern)\n        # operator.add on coverage_analysis acts as fan-in across all spec_evaluator results\n        sg.add_edge(\"spec_evaluator\", \"synthesizer\")\n        sg.add_edge(\"synthesizer\", END)"}, "imports": ["qaai/agents/clients.py", "qaai/core/config.py", "qaai/core/cache.py", "qaai/utils.py", "qaai/agents/shared/data_integration.py", "qaai/agents/shared/gate.py", "qaai/agents/test_suite_reviewer/nodes.py", "qaai/agents/test_suite_reviewer/core.py"], "imported_by": ["qaai/api/services.py", "qaai/agents/hazard_risk_reviewer/nodes.py", "qaai/agents/hazard_risk_reviewer/pipeline.py", "qaai/eval/runners.py"]}, {"path": "qaai/agents/test_case_reviewer/__init__.py", "language": "python", "role": "Test-case reviewer package exports", "explanation": "Re-exports the TC core models (ReviewObjective, EvaluatedReviewObjective, SpecAnalysis, OverallAnalysis, TestCaseAssessment, TCReviewState), the node classes/factories, and the TCReviewerRunnable.", "python_analogy": "A package __init__ curating __all__ so callers import from qaai.agents.test_case_reviewer directly.", "key_snippet": {"start": 1, "end": 29, "code": "\"\"\"Single-test-case reviewer component.\"\"\"\n\nfrom .core import (\n    DecomposedRequirement,\n    DecomposedSpec,\n    EvaluatedReviewObjective,\n    OverallAnalysis,\n    Requirement,\n    ReviewObjective,\n    SpecAnalysis,\n    TCReviewState,\n    TestCase,\n    TestCaseAssessment,\n    Verdict,\n)\nfrom .nodes import (\n    AggregatorNode,\n    OverallLogicalNode,\n    OverallPrereqsNode,\n    RequirementCoveragePipelineNode,\n    SingleSpecCoverageNode,\n    dispatch_requirement_pipeline,\n    make_aggregator_node,\n    make_coverage_single_node,\n    make_logical_single_node,\n    make_prereqs_single_node,\n    make_requirement_coverage_pipeline_node,\n)\nfrom .pipeline import TCReviewerRunnable"}, "imports": ["qaai/agents/test_case_reviewer/core.py", "qaai/agents/test_case_reviewer/nodes.py", "qaai/agents/test_case_reviewer/pipeline.py"], "imported_by": []}, {"path": "qaai/agents/test_case_reviewer/core.py", "language": "python", "role": "Test-case output models + TCReviewState (5-objective checklist)", "explanation": "TC-specific models: ReviewObjective/EvaluatedReviewObjective (a checklist row with a partial flag), SpecAnalysis, OverallAnalysis, and TestCaseAssessment (with model_validators that un-nest an LLM-wrapped payload and coerce 'Partial' verdicts). TCReviewState carries three operator.add fan-in lists (decomposed_requirements, coverage_analysis) plus test-level analyses.", "python_analogy": "A schema module where @model_validator(mode='before') is like __post_init__ that repairs malformed input before validation — defensive parsing for LLM output.", "key_snippet": {"start": 260, "end": 279, "code": "class TCReviewState(BaseReviewState, total=False):\n    # cache_mode + JAMA integration fields (pyjama_request / jama_data /\n    # jama_metadata) are inherited from BaseReviewState.\n    # Data source fields (Option 1: local OR Option 2: JAMA)\n    test_case: TestCase\n    requirements: List[Requirement]\n    design_docs: List[DesignDocument]\n    # Pipeline state fields\n    # Reduced channel: in decomposition mode the graph fans out one\n    # requirement_pipeline Send per requirement, each returning its single\n    # DecomposedRequirement, so concurrent writes accumulate instead of clobbering.\n    # In no-decomposition mode nothing writes this key (aggregator falls back to []).\n    decomposed_requirements: Annotated[List[DecomposedRequirement], operator.add]\n    # Coverage stays per-spec — Send fan-out emits one SpecAnalysis per spec.\n    coverage_analysis: Annotated[List[SpecAnalysis], operator.add]\n    # Logical-structure and prereqs are TEST-CASE-LEVEL from v3 onwards. Each is\n    # produced by exactly one node call (no Send fan-out), so no operator.add reducer.\n    logical_structure_analysis: Optional[OverallAnalysis]\n    prereqs_analysis: Optional[OverallAnalysis]\n    aggregated_assessment: Optional[TestCaseAssessment]"}, "imports": ["qaai/agents/shared/core.py"], "imported_by": ["qaai/agents/test_case_reviewer/nodes.py", "qaai/agents/test_case_reviewer/pipeline.py"]}, {"path": "qaai/agents/test_case_reviewer/nodes.py", "language": "python", "role": "TC nodes: fused decompose→cover pipeline, axis evaluators, aggregator", "explanation": "RequirementCoveragePipelineNode fuses decompose+coverage per requirement so coverage overlaps decomposition across requirements (dispatch_requirement_pipeline fans one Send per requirement). The logical and prereqs axes are single test-case-level calls; AggregatorNode (is_final_output) synthesizes all three axis lists into the TestCaseAssessment. A no-decomposition variant reviews the raw requirement instead.", "python_analogy": "Composite nodes that call other nodes internally, then gather — like an async orchestrator method that awaits a decompose() then gathers cover() over its outputs.", "key_snippet": {"start": 88, "end": 117, "code": "    async def __call__(self, state: TCReviewState) -> dict:\n        test_case = state.get(\"test_case\")\n        requirement = state.get(\"requirement\")\n        if test_case is None or requirement is None:\n            logger.warning(\"RequirementCoveragePipelineNode: incomplete Send payload, skipping\")\n            return {\"decomposed_requirements\": [], \"coverage_analysis\": []}\n\n        cache_mode = state.get(\"cache_mode\", \"on\")\n        dec_update = await self._decomposer(\n            {\"requirement\": requirement, \"cache_mode\": cache_mode}\n        )\n        decomposed = dec_update.get(\"decomposed_requirement\")\n        if decomposed is None:\n            logger.warning(\n                \"RequirementCoveragePipelineNode: decomposition failed for requirement %s\",\n                getattr(requirement, \"req_id\", None),\n            )\n            return {\"decomposed_requirements\": [], \"coverage_analysis\": []}\n\n        # Cover this requirement's specs concurrently — no barrier waiting on\n        # the other requirements' decompositions.\n        cov_updates = await asyncio.gather(*(\n            self._coverage({\n                \"test_case\": test_case,\n                \"requirement\": decomposed.requirement,\n                \"decomposed_spec\": spec,\n                \"cache_mode\": cache_mode,\n            })\n            for spec in decomposed.decomposed_specifications\n        ))"}, "imports": ["qaai/agents/shared/nodes.py", "qaai/core/cache.py", "qaai/core/config.py", "qaai/utils.py", "qaai/agents/test_case_reviewer/core.py"], "imported_by": ["qaai/agents/test_case_reviewer/pipeline.py"]}, {"path": "qaai/agents/test_case_reviewer/pipeline.py", "language": "python", "role": "TCReviewerRunnable — builds/compiles the test-case StateGraph", "explanation": "Builds the 3-axis TC graph. include_decomposition toggles between the fused requirement_pipeline fan-out (v2) and a direct per-requirement coverage_evaluator (v3, no decomposition). Logical and prereqs run as direct test-level edges; all fan into the aggregator. Compiles with a checkpointer and writes tc_graph.png.", "python_analogy": "A builder that conditionally wires two graph shapes from one flag — like a factory that returns a different pipeline depending on a config boolean.", "key_snippet": {"start": 146, "end": 168, "code": "        if self.include_decomposition:\n            requirement_pipeline = make_requirement_coverage_pipeline_node(\n                self.client, self.model, self.model_kwargs,\n                decomposer_template=pc.decomposer,\n                coverage_template=pc.single_test_coverage_eval,\n                cache_manager=cm,\n            )\n            sg.add_node(\"requirement_pipeline\", requirement_pipeline)\n            sg.add_conditional_edges(\n                \"coverage_router\", dispatch_requirement_pipeline, [\"requirement_pipeline\"]\n            )\n            sg.add_edge(\"requirement_pipeline\", \"aggregator\")\n        else:\n            coverage_eval = make_coverage_single_node(\n                self.client, self.model, self.model_kwargs,\n                prompt_template=pc.single_test_coverage_eval, cache_manager=cm,\n                include_decomposition=False,\n            )\n            sg.add_node(\"coverage_evaluator\", coverage_eval)\n            sg.add_conditional_edges(\n                \"coverage_router\", dispatch_coverage_by_requirement, [\"coverage_evaluator\"]\n            )\n            sg.add_edge(\"coverage_evaluator\", \"aggregator\")"}, "imports": ["qaai/agents/clients.py", "qaai/core/config.py", "qaai/core/cache.py", "qaai/utils.py", "qaai/agents/shared/data_integration.py", "qaai/agents/shared/gate.py", "qaai/agents/test_case_reviewer/nodes.py", "qaai/agents/test_case_reviewer/core.py"], "imported_by": ["qaai/api/services.py", "qaai/eval/runners.py"]}, {"path": "qaai/agents/hazard_risk_reviewer/__init__.py", "language": "python", "role": "Hazard reviewer package exports", "explanation": "Re-exports the hazard core models (HazardRowWithTraceMatrix, HazardTraceMatrix, HazardFinding, HazardAssessment, RequirementReview, HazardReviewState, …), the node factories + RequirementReviewerNode, and the HazardReviewerRunnable.", "python_analogy": "A package __init__ with __all__ curating the hazard reviewer's public surface.", "key_snippet": {"start": 3, "end": 19, "code": "from .core import (\n    DesignDocument,\n    FinalAssessorProse,\n    HazardAssessment,\n    HazardCode,\n    HazardDimension,\n    HazardFinding,\n    HazardPackage,\n    HazardRowWithTraceMatrix,\n    HazardRowFromExcel,\n    HazardPackageFromExcel,\n    HazardTraceMatrix,\n    HazardReviewState,\n    HazardVerdict,\n    HazardVerdictNA,\n    RequirementReview,\n)"}, "imports": ["qaai/agents/hazard_risk_reviewer/core.py", "qaai/agents/hazard_risk_reviewer/nodes.py", "qaai/agents/hazard_risk_reviewer/pipeline.py"], "imported_by": []}, {"path": "qaai/agents/hazard_risk_reviewer/core.py", "language": "python", "role": "Hazard models: SHA row schema, trace matrix, H1–H6+R7 findings, state", "explanation": "HazardRowFromExcel maps every SHA (Software Hazard Analysis) Excel column via Pydantic aliases; HazardTraceMatrix bundles traced requirements/test cases/design docs; RequirementReview carries the embedded RTM SynthesizedAssessment per requirement; HazardFinding/HazardAssessment model the H1–H6 mandatory + R7 recommended rubric; HazardReviewState declares the fan-in reducers.", "python_analogy": "A large models module — the Excel-column aliases are like marshmallow field(data_key=...) mappings from spreadsheet headers to snake_case attributes.", "key_snippet": {"start": 399, "end": 421, "code": "class HazardReviewState(TypedDict, total=False):\n    # Does NOT inherit shared.core.BaseReviewState: this state declares narrower\n    # JAMA types (typed PyJamaRequest, jama_data/metadata as List[Any]/Any) and\n    # adds pyjama_test_mode, so the fields are kept local by design.\n    # Caching control: \"off\" | \"on\" (default) | \"test\". Threaded from the\n    # API/service into every node; see qaai.core.cache.ReviewCacheManager.\n    cache_mode: str\n    hazard: HazardRowWithTraceMatrix\n    pyjama_request: Optional[PyJamaRequest]\n    # Per-run cache-only JAMA override (None ⇒ use the node/config default).\n    pyjama_test_mode: Optional[bool]\n    jama_data: Optional[List[Any]]\n    jama_metadata: Optional[Any]\n    requirement_reviews: Annotated[List[RequirementReview], operator.add]\n    summarized_designs: Optional[List[HazardSummarizedDesignSpec]]\n    summarized_user_needs: Optional[List[HazardSummarizedUserNeed]]\n    hazard_findings: Annotated[List[HazardFinding], operator.add]\n    hazard_assessment: Optional[HazardAssessment]\n    # Input-gate outcome (see qaai.agents.shared.gate). Mirrors BaseReviewState's\n    # gate fields, declared locally since HazardReviewState does not inherit it.\n    review_status: Optional[str]\n    skip_reason: Optional[str]\n    missing_fields: Optional[List[str]]"}, "imports": ["qaai/agents/shared/core.py", "qaai/agents/test_suite_reviewer/core.py"], "imported_by": ["qaai/agents/hazard_risk_reviewer/nodes.py", "qaai/agents/hazard_risk_reviewer/pipeline.py", "qaai/agents/hazard_risk_reviewer/loader.py", "qaai/agents/shared/data_integration.py", "qaai/api/services.py"]}, {"path": "qaai/agents/hazard_risk_reviewer/nodes.py", "language": "python", "role": "Hazard evaluators (H1–H6+R7), RTM-subgraph node, deterministic final assessor", "explanation": "Per-dimension evaluators dispatched by data dependency; RequirementReviewerNode invokes the whole compiled RTM graph as a subgraph per traced requirement (cached per req_id). _FinalAssessorNode assembles HazardAssessment deterministically — the LLM only writes comments/questions while overall_verdict is computed in code (Yes iff every mandatory H1–H6 ∈ {Yes,N-A}; R7 excluded).", "python_analogy": "Nodes that call a whole other pipeline inside themselves — like a service method that awaits another service's graph and then reduces the results, with the final verdict computed in Python not by the model.", "key_snippet": {"start": 789, "end": 800, "code": "    @staticmethod\n    def _aggregate_verdict(findings: List[HazardFinding]) -> str:\n        \"\"\"Yes iff every MANDATORY finding's verdict is in {Yes, N-A}; else No.\n\n        R7 is a recommended (advisory) criterion and is excluded from the\n        aggregation — an R7 = No never flips overall_verdict.\n        \"\"\"\n        return (\n            \"Yes\"\n            if all(f.verdict in (\"Yes\", \"N-A\") for f in findings if f.code != \"R7\")\n            else \"No\"\n        )"}, "imports": ["qaai/agents/shared/nodes.py", "qaai/agents/test_suite_reviewer/pipeline.py", "qaai/core/cache.py", "qaai/utils.py", "qaai/agents/hazard_risk_reviewer/core.py", "qaai/agents/hazard_risk_reviewer/constants.py"], "imported_by": ["qaai/agents/hazard_risk_reviewer/pipeline.py"]}, {"path": "qaai/agents/hazard_risk_reviewer/pipeline.py", "language": "python", "role": "HazardReviewerRunnable — staged hazard graph embedding the RTM subgraph", "explanation": "Builds the hazard graph staged by data dependency: H1/R7 run immediately; H2/H3 dispatch off the design_summarizer; requirement_reviewer fans one Send per traced requirement (each invoking the RTM subgraph); H4/H5 wait on those + summarizers; H6 joins H4/H5; a deterministic final_assessment aggregates all seven. Shares one compiled RTMReviewerRunnable across fan-outs.", "python_analogy": "A builder that nests one compiled graph inside another and orders nodes by their data prerequisites — like composing sub-DAGs with explicit join barriers.", "key_snippet": {"start": 279, "end": 302, "code": "        # Late evaluators (H4, H5) wait for requirement_reviews AND summarizers\n        # We need a join node to synchronize requirement_reviewer + design_summarizer + needs_summarizer\n        sg.add_node(\"late_evaluator_router\", lambda state: {})\n        \n        # All three must complete before late_evaluator_router\n        sg.add_edge(\"requirement_reviewer\", \"late_evaluator_router\")\n        sg.add_edge(\"design_summarizer\", \"late_evaluator_router\")\n        sg.add_edge(\"needs_summarizer\", \"late_evaluator_router\")\n        \n        # Then dispatch H4, H5 from the router\n        sg.add_conditional_edges(\n            \"late_evaluator_router\",\n            dispatch_hazard_evaluators_late,\n            [\"h4_evaluator\", \"h5_evaluator\"],\n        )\n\n        # H6 waits for H4 and H5 (2-way join, same superstep).\n        # H3 runs after the design_summarizer — which completes no later than\n        # late_evaluator_router (it is one of that router's inputs) — so H3's\n        # finding is already in the hazard_findings reducer before H4/H5, and\n        # therefore before H6. A direct h3→h6 edge would fire H6 a full\n        # superstep early, before H4/H5 exist, causing a spurious skip.\n        sg.add_edge(\"h4_evaluator\", \"h6_evaluator\")\n        sg.add_edge(\"h5_evaluator\", \"h6_evaluator\")"}, "imports": ["qaai/agents/clients.py", "qaai/core/config.py", "qaai/core/cache.py", "qaai/utils.py", "qaai/agents/shared/data_integration.py", "qaai/agents/shared/gate.py", "qaai/agents/test_suite_reviewer/pipeline.py", "qaai/agents/hazard_risk_reviewer/nodes.py", "qaai/agents/hazard_risk_reviewer/core.py"], "imported_by": ["qaai/api/services.py", "qaai/eval/runners.py"]}, {"path": "qaai/agents/hazard_risk_reviewer/loader.py", "language": "python", "role": "SHA Excel parser + pyjama-traceability merge", "explanation": "parse_sha_excel() reads the SHA worksheet with pandas/openpyxl, normalizes headers, extracts control-reference identifiers (regex, default GID-\\d+) from the Risk Control Measures column, and builds HazardRowFromExcel models. merge_hazard_with_pyjama_traceability() joins each row's identifiers against a pyjama lookup to populate its HazardTraceMatrix.", "python_analogy": "An ETL/loader module — pandas.read_excel + a regex-driven join, like parsing a CSV into dataclasses and enriching each row from a lookup dict.", "key_snippet": {"start": 91, "end": 116, "code": "    for _, row in df.iterrows():\n        # 1. Combine text strictly from the Risk Control Measures columns\n        rcm_text = \" \".join([str(row.get(col, \"\")) for col in rcm_columns if pd.notna(row.get(col))])\n        \n        # 2. Extract GIDs for this specific row using the provided format\n        row_gids = extract_gids(rcm_text, extract_gids_format)\n        if rcm_text.strip():\n            rows_with_text += 1\n\n        # 3. Add to the global set of all unique GIDs\n        all_gids_set.update(row_gids)\n\n        # Convert row to dict for model validation, then add extracted GIDs\n        row_dict = normalize_row_dict(row.to_dict())\n        \n        # Explicitly set risk_control_measures from the matched RCM columns\n        # This ensures the field is populated even if the Excel column header\n        # doesn't exactly match the Pydantic alias (e.g., multi-line headers)\n        row_dict[\"risk_control_measures\"] = rcm_text\n        \n        row_dict[\"row_specific_controls_references\"] = sorted(set(row_gids))\n        \n        # Create HazardRowFromExcel model\n        hazard_row = HazardRowFromExcel.model_validate(row_dict)\n        results.append(hazard_row)\n"}, "imports": ["qaai/agents/hazard_risk_reviewer/core.py"], "imported_by": ["qaai/agents/shared/data_integration.py", "qaai/api/services.py"]}, {"path": "qaai/agents/hazard_risk_reviewer/constants.py", "language": "python", "role": "Required SHA fields for the hazard input gate", "explanation": "HAZARD_RISK_REVIEWER_REQUIRED_HAZARD_FIELDS lists the snake_case SHA fields a hazard record must populate for a review to be meaningful; validate_hazard_inputs checks each and the gate skips the record (no LLM calls) when any are blank.", "python_analogy": "A module-level list of required field names — like a REQUIRED_FIELDS constant a validator iterates over.", "key_snippet": {"start": 14, "end": 30, "code": "HAZARD_RISK_REVIEWER_REQUIRED_HAZARD_FIELDS = [\n    \"hazard_id\",\n    \"hazardous_situation_id\",\n    \"hazard\",\n    \"hazardous_situation\",\n    \"function\",\n    \"hazardous_sequence_of_events\",\n    \"harm\",\n    \"severity\",\n    \"probability_of_harm_pre_mitigation\",\n    \"initial_risk_rating\",\n    \"risk_control_measures\",\n    \"severity_of_harm_post_mitigation\",\n    \"probability_of_harm_post_mitigation\",\n    \"final_risk_rating\",\n    \"residual_risk_acceptability\",\n]"}, "imports": [], "imported_by": ["qaai/agents/hazard_risk_reviewer/nodes.py"]}, {"path": "qaai/api/main.py", "language": "python", "role": "FastAPI app factory + lifespan (builds the three reviewer services)", "explanation": "create_app() builds the FastAPI app with CORS/GZip/logging middleware and mounts the built Vue SPA (qaai/web/dist) at / (falling back to the legacy static UI). The lifespan context manager initializes the shared LLM client, telemetry, cache manager, JobManager, and the RTM/Hazard/TestCase services once at startup and stores them on app.state.", "python_analogy": "The application entry point — like a create_app() factory plus a startup/shutdown lifespan, similar to Flask's app factory with before_first_request wiring.", "key_snippet": {"start": 125, "end": 148, "code": "    app.state.rtm_service = RTMReviewService(\n        client,\n        settings.model,\n        model_kwargs=settings.model_kwargs,\n        pyjama_config=pyjama_config,\n        cache_manager=cache_manager,\n    )\n    app.state.hazard_service = HazardReviewService(\n        client,\n        settings.model,\n        # Intentional: pass model_kwargs (max_tokens) here too, so the hazard\n        # graphs and their embedded RTM respect max_output_tokens like the RTM/TC\n        # services do (avoids truncating large completions). Do not drop this.\n        model_kwargs=settings.model_kwargs,\n        pyjama_config=pyjama_config,\n        cache_manager=cache_manager,\n    )\n    app.state.test_case_service = TestCaseReviewService(\n        client=client,\n        model=settings.model,\n        model_kwargs=settings.model_kwargs,\n        pyjama_config=pyjama_config,\n        cache_manager=cache_manager,\n    )"}, "imports": ["qaai/api/middleware.py", "qaai/api/jobs.py", "qaai/api/routes.py", "qaai/api/services.py", "qaai/agents/clients.py", "qaai/core/cache.py", "qaai/core/config.py", "qaai/core/telemetry.py", "qaai/core/logging_config.py"], "imported_by": ["qaai/api/run.py"]}, {"path": "qaai/api/routes.py", "language": "python", "role": "APIRouter — the /api/v1 endpoints (reviews, jobs, identity, feedback)", "explanation": "Defines every endpoint: the three review POSTs (each returns 202 + job_id via the JobManager), the jobs status/cancel/result endpoints, GET /me (identity), GET /health, and POST /feedback-upload. _resolve_cache_mode maps the UI radio + legacy booleans to the on/test/off cache mode; resolve_prompt_set picks the v3/v4 prompt bundle.", "python_analogy": "A router module of view functions with Depends() injection — like Flask blueprints or DRF viewsets, one function per route.", "key_snippet": {"start": 86, "end": 111, "code": "@router.post(\"/test-suite-review\", tags=[\"Test Suite Review\"], status_code=202)\nasync def test_suite_review(\n    body: BaselineRequest,\n    request: Request,\n    service: RTMReviewService = Depends(get_rtm_service),\n    job_manager: JobManager = Depends(get_job_manager),\n) -> JSONResponse:\n    \"\"\"Submit an RTM coverage review for every requirement in a JAMA baseline.\n\n    Runs asynchronously: returns 202 + job_id immediately, then poll\n    GET /jobs/{job_id} and download GET /jobs/{job_id}/result (a self-contained\n    viewer.html with M1-M5 rubric results) when status is \"completed\". Requires\n    JAMA credentials configured in the server's .env.\n    \"\"\"\n    cache_mode = _resolve_cache_mode(body.cache_mode, body.use_cache)\n    test_mode = body.test_mode if body.test_mode is not None else settings.pyjama_test_mode\n    prompt_set = resolve_prompt_set(body.include_edge_case_analysis)\n\n    return _submit_with_job_id(\n        job_manager,\n        lambda job: service.run_from_baseline(\n            body.baseline_id, job.job_id, cache_mode, test_mode,\n            prompt_set=prompt_set, progress=job,\n        ),\n        \"qaai_rtm_review.html\",\n    )"}, "imports": ["qaai/api/jobs.py", "qaai/api/schemas.py", "qaai/api/services.py", "qaai/core/config.py", "qaai/api/identity.py"], "imported_by": ["qaai/api/main.py"]}, {"path": "qaai/api/services.py", "language": "python", "role": "One service per reviewer + the shared success-gated batch loop", "explanation": "RTM/Hazard/TestCase service classes each hold one compiled graph per prompt set and expose run_from_baseline / run_from_excel_upload. The shared _run_batch_review() writes inputs/outputs JSONL, invokes the graph per item, gates cache reuse on an is_complete check (purging failed/incomplete runs by timestamp), reports live progress onto the Job, and renders the HTML viewer.", "python_analogy": "A service layer between the API and the graphs — the batch loop is like a worker that processes a queue of items, skipping bad ones and recording per-item status.", "key_snippet": {"start": 231, "end": 256, "code": "        config = {\"configurable\": {\"thread_id\": thread_id_fn(i, item)}}\n        item_start = datetime.now()  # boundary for run-scoped cache purge\n        try:\n            final_state = await graph.ainvoke(graph_input_fn(i, item), config)\n        except CacheRequiredError as exc:\n            # Cache \"test\" mode: a node had no cached result, so the report cannot\n            # be recreated offline. This is a hard, whole-job failure (not a skip)\n            # surfaced verbatim to the UI as a 400 by jobs.py.\n            logger.warning(\n                \"[%d/%d] %s review aborted — test mode cache miss: %s\",\n                i + 1, len(items), item_noun, exc,\n            )\n            raise ValueError(\n                \"Test mode requires all node results to pre-exist in cache\"\n            ) from exc\n        except Exception as exc:\n            failed += 1\n            logger.error(\n                \"[%d/%d] %s review errored, skipping item: %s\",\n                i + 1, len(items), item_noun, exc, exc_info=True,\n            )\n            _log(item_id, \"error\", f\"{item_noun.capitalize()} {label}: review errored — item skipped.\")\n            await _purge(i, item, \"run errored\", item_start)\n            if progress is not None:\n                progress.record_item(ok=False)\n            continue"}, "imports": ["qaai/agents/clients.py", "qaai/agents/shared/nodes.py", "qaai/core/cache.py", "qaai/agents/hazard_risk_reviewer/pipeline.py", "qaai/agents/test_suite_reviewer/pipeline.py", "qaai/agents/test_case_reviewer/pipeline.py", "qaai/core/config.py", "qaai/viewer/generator.py", "qaai/core/logging_config.py"], "imported_by": ["qaai/api/main.py", "qaai/api/routes.py", "qaai/eval/runners.py"]}, {"path": "qaai/api/jobs.py", "language": "python", "role": "In-memory async JobManager (202 → poll → download)", "explanation": "Reviews run as background asyncio tasks so no proxy idle-timeout can fire. JobManager.submit() schedules a Job, serializes execution with an asyncio.Lock (preserving the per-run-folder logging invariant), and tracks status/progress/result-path. Job carries live progress (begin/record_item/add_message) and an ETA, surfaced by GET /jobs/{id}.", "python_analogy": "A tiny in-process task queue — like a dict of futures with a lock, similar to a minimal Celery result backend held in memory.", "key_snippet": {"start": 166, "end": 195, "code": "    async def _run(self, job: Job, coro_factory: CoroFactory) -> None:\n        # The lock makes reviews run one at a time, preserving the per-run-folder\n        # logging invariant. While queued, the job stays in PENDING.\n        async with self._run_lock:\n            self._set(job, RUNNING)\n            logger.info(\"Job %s running\", job.job_id)\n            try:\n                result_path = await coro_factory(job)\n            except asyncio.CancelledError:\n                # User asked to stop the run (cancel & discard). Record a terminal\n                # state and swallow — no partial report is kept.\n                self._fail(job, \"Run stopped by user.\", 499)\n                self._set(job, CANCELLED)\n                logger.info(\"Job %s cancelled\", job.job_id)\n                return\n            except ValueError as exc:\n                # Bad input (e.g. unknown baseline) — surface the detail as a 400.\n                self._fail(job, str(exc), 400)\n                logger.warning(\"Job %s failed (bad request): %s\", job.job_id, exc)\n            except Exception as exc:  # noqa: BLE001 — log full, surface generic\n                self._fail(\n                    job,\n                    f\"An internal error occurred (job_id: {job.job_id})\",\n                    500,\n                )\n                logger.error(\"Job %s failed: %s\", job.job_id, exc, exc_info=True)\n            else:\n                job.result_path = result_path\n                self._set(job, COMPLETED)\n                logger.info(\"Job %s completed -> %s\", job.job_id, result_path)"}, "imports": [], "imported_by": ["qaai/api/main.py", "qaai/api/routes.py"]}, {"path": "qaai/api/middleware.py", "language": "python", "role": "Request-logging + body-size-limit middleware", "explanation": "log_requests attaches a UUID request id, times each request, logs start/complete/fail, and echoes X-Request-ID; limit_request_size rejects POST bodies larger than MAX_REQUEST_BODY_SIZE (10MB) with a 413.", "python_analogy": "ASGI middleware functions — like Django middleware or a Flask before/after_request pair wrapping call_next.", "key_snippet": {"start": 60, "end": 69, "code": "async def limit_request_size(request: Request, call_next: Callable):\n    \"\"\"Reject requests with bodies larger than MAX_REQUEST_BODY_SIZE.\"\"\"\n    if request.method == \"POST\":\n        content_length = request.headers.get(\"content-length\")\n        if content_length and int(content_length) > MAX_REQUEST_BODY_SIZE:\n            return JSONResponse(\n                status_code=413,\n                content={\"detail\": \"Request body too large (max 10MB)\"},\n            )\n    return await call_next(request)"}, "imports": ["qaai/core/constants.py"], "imported_by": ["qaai/api/main.py"]}, {"path": "qaai/api/identity.py", "language": "python", "role": "RBAC identity resolver for GET /api/v1/me", "explanation": "resolve_identity() decodes the ALB-injected x-amzn-oidc-data OIDC JWT payload (signature verification is the documented follow-up) and maps SSO groups to QAAI roles, or returns a DEV-only fallback identity when no header is present (failing closed outside DEV). Identity-read only — it does NOT gate the review endpoints yet.", "python_analogy": "An auth resolver that decodes a JWT's claims — like reading request.user from a middleware-injected header, but the signature check is intentionally deferred.", "key_snippet": {"start": 78, "end": 106, "code": "def resolve_identity(request: Request) -> dict[str, Any]:\n    \"\"\"Return ``{\"user\": {...}|None, \"roles\": [...]}`` for the current request.\"\"\"\n    token = request.headers.get(ALB_OIDC_DATA_HEADER)\n\n    if token:\n        claims = _decode_oidc_claims(token)\n        email = claims.get(\"email\") or claims.get(\"username\") or claims.get(\"sub\") or \"unknown\"\n        name = claims.get(\"name\") or claims.get(\"username\") or email\n        roles = _roles_from_groups(_extract_groups(claims))\n        return {\n            \"user\": {\"id\": claims.get(\"sub\") or email, \"name\": name, \"email\": email},\n            \"roles\": roles,\n        }\n\n    # No edge auth header. Only DEV grants a fallback identity; other environments\n    # fail closed so the SPA shows \"Access denied\" instead of silently authorizing.\n    if settings.app_env.upper() == \"DEV\":\n        roles = settings.dev_roles_list\n        if roles:\n            return {\n                \"user\": {\n                    \"id\": \"dev\",\n                    \"name\": settings.dev_user_name,\n                    \"email\": settings.dev_user_email,\n                },\n                \"roles\": roles,\n            }\n\n    return {\"user\": None, \"roles\": []}"}, "imports": ["qaai/core/config.py"], "imported_by": ["qaai/api/routes.py"]}, {"path": "qaai/api/schemas.py", "language": "python", "role": "BaselineRequest — the JSON body for baseline review endpoints", "explanation": "Pydantic request model for the RTM and TC endpoints: baseline_id plus the cache_mode radio (with legacy partial/full aliases), the deprecated use_cache boolean, test_mode (cache-only JAMA), and the include_edge_case_analysis / include_decomposition_analysis toggles.", "python_analogy": "A pydantic request DTO — like a DRF serializer or FastAPI body model validating the POST payload.", "key_snippet": {"start": 6, "end": 27, "code": "class BaselineRequest(BaseModel):\n    \"\"\"Request body for baseline-driven review endpoints.\"\"\"\n    baseline_id: str = Field(..., description=\"JAMA baseline ID, e.g. 'BASE-84429'\")\n    cache_mode: Optional[Literal[\"off\", \"on\", \"test\", \"partial\", \"full\"]] = Field(\n        default=None,\n        description=(\n            \"Explicit cache mode (the UI radio toggle). 'off' = never read; always \"\n            \"re-run every node and save a new timestamped result. 'on' = reuse the \"\n            \"newest cached interim results and only re-run the final assessment \"\n            \"fresh. 'test' = recreate the report entirely from cache with no LLM \"\n            \"calls (fails if any node result is missing). When omitted, falls back \"\n            \"to the legacy 'use_cache' boolean. Legacy 'partial'/'full' are \"\n            \"accepted and map to 'on'/'test'.\"\n        ),\n    )\n    use_cache: bool = Field(\n        default=True,\n        description=(\n            \"Deprecated, kept for backward compatibility. Ignored when 'cache_mode' \"\n            \"is set. True maps to 'on', False to 'off'.\"\n        ),\n    )"}, "imports": [], "imported_by": ["qaai/api/routes.py"]}, {"path": "qaai/api/run.py", "language": "python", "role": "CLI launcher — starts uvicorn as a subprocess with long keep-alive", "explanation": "The `qaai-api` console entry point. Launches uvicorn qaai.api.main:app as a subprocess (to avoid Jupyter nest-asyncio conflicts) with a 600s keep-alive; host/port/reload/workers come from env vars.", "python_analogy": "A thin main() that shells out to uvicorn via subprocess.Popen — like a manage.py runserver wrapper.", "key_snippet": {"start": 72, "end": 92, "code": "    uvicorn_cmd = [\n        sys.executable,\n        \"-m\",\n        \"uvicorn\",\n        \"qaai.api.main:app\",\n        \"--host\",\n        host,\n        \"--port\",\n        str(port),\n        \"--timeout-keep-alive\",\n        \"600\",  # 10 minutes\n    ]\n    \n    # Add reload flag if enabled\n    if reload:\n        uvicorn_cmd.append(\"--reload\")\n    \n    # Add workers if > 1\n    if workers > 1:\n        uvicorn_cmd.extend([\"--workers\", str(workers)])\n    "}, "imports": ["qaai/api/main.py"], "imported_by": []}, {"path": "qaai/prompts/_registry.py", "language": "python", "role": "Prompt-set registry loader (resolve manifests → template paths + SHA)", "explanation": "load_set(name) reads a sets/<name>.yaml manifest and resolves each role→version into a ResolvedPrompt (template path + meta.yaml), returning a hash-pinned ResolvedPromptSet with the manifest sha256 (for MLflow provenance). _role_dir maps a logical role to its on-disk template directory using PromptConfig defaults. list_sets() enumerates available sets by status.", "python_analogy": "A plugin/registry loader — reads YAML manifests and returns frozen dataclasses, like an entry-point registry that pins versions by content hash.", "key_snippet": {"start": 76, "end": 97, "code": "    manifest = yaml.safe_load(manifest_path.read_text())\n    resolved = {}\n    \n    for role, version in manifest[\"prompts\"].items():\n        version_dir = PROMPTS_DIR / _role_dir(role) / version\n        template = version_dir / \"template.jinja2\"\n        meta_path = version_dir / \"meta.yaml\"\n        \n        if not template.exists() or not meta_path.exists():\n            raise FileNotFoundError(\n                f\"prompt set {name}: role={role} version={version} missing \"\n                f\"template.jinja2 or meta.yaml at {version_dir}\"\n            )\n        \n        meta = yaml.safe_load(meta_path.read_text())\n\n        resolved[role] = ResolvedPrompt(\n            role=role,\n            version=version,\n            template_path=template,\n            meta=meta,\n        )"}, "imports": ["qaai/core/config.py"], "imported_by": ["qaai/core/config.py", "qaai/eval/mlflow_run.py"]}, {"path": "qaai/viewer/__init__.py", "language": "python", "role": "Viewer package public API (write_viewer / build_viewer)", "explanation": "Exposes build_viewer/write_viewer (RTM), build_viewer_tc/write_viewer_tc, and build_viewer_hz/write_viewer_hz plus the three HTML templates, and documents the `python -m qaai.viewer` CLI.", "python_analogy": "A package facade that re-exports the generator functions so callers do `from qaai.viewer import write_viewer`.", "key_snippet": {"start": 13, "end": 24, "code": "from qaai.viewer.generator import (\n    build_viewer,\n    build_viewer_hz,\n    build_viewer_tc,\n    write_viewer,\n    write_viewer_hz,\n    write_viewer_tc,\n)\nfrom qaai.viewer.template import HTML_TEMPLATE\nfrom qaai.viewer.template_hazard_review import HZ_HTML_TEMPLATE\nfrom qaai.viewer.template_test_case import TC_HTML_TEMPLATE\n"}, "imports": ["qaai/viewer/generator.py", "qaai/viewer/template.py", "qaai/viewer/template_hazard_review.py", "qaai/viewer/template_test_case.py"], "imported_by": []}, {"path": "qaai/viewer/__main__.py", "language": "python", "role": "`python -m qaai.viewer` CLI entry", "explanation": "Delegates to generator.main() so the viewer can be run as a module against an outputs.jsonl.", "python_analogy": "The __main__.py that makes a package runnable with python -m — a two-line shim to a main().", "key_snippet": {"start": 1, "end": 6, "code": "import sys\nfrom qaai.viewer.generator import main\n\nif __name__ == \"__main__\":\n    sys.exit(main())"}, "imports": ["qaai/viewer/generator.py"], "imported_by": []}, {"path": "qaai/viewer/generator.py", "language": "python", "role": "Render/write the self-contained HTML viewers from outputs.jsonl", "explanation": "Reads a run's outputs.jsonl, injects the records (and problem-note log) into the right per-reviewer HTML template as JSON, and writes viewer.html / viewer_tc.html / viewer_hz.html next to the JSONL. The three reviewers differ only by a (template, title, feedback-type, filename) tuple, so build/write logic is shared and keyed by review_type.", "python_analogy": "A static-site renderer — string-substitute JSON into an HTML template and write a file, like a tiny Jinja-free templater.", "key_snippet": {"start": 18, "end": 41, "code": "def _render(\n    records: Iterable[dict],\n    source_label: str,\n    run_key: str,\n    template: str,\n    title_prefix: str,\n    review_type: str,\n    log_entries: Optional[list] = None,\n) -> str:\n    data_json = json.dumps(list(records), ensure_ascii=False)\n    data_json = data_json.replace(\"<\/\", \"<\\\\/\")\n    log_json = json.dumps(list(log_entries or []), ensure_ascii=False)\n    log_json = log_json.replace(\"<\/\", \"<\\\\/\")\n    return (\n        template\n        .replace(\"{{DATA}}\", data_json)\n        .replace(\"{{LOG}}\", log_json)\n        .replace(\"{{SOURCE}}\", _escape_html(source_label))\n        .replace(\"{{TITLE}}\", _escape_html(f\"{title_prefix} — {source_label}\"))\n        .replace(\"{{RUN_KEY}}\", _escape_html(run_key))\n        # review_type labels the exported feedback file:\n        # feedback_{review_type}_{run_key}.json\n        .replace(\"{{REVIEW_TYPE}}\", review_type)\n    )"}, "imports": ["qaai/viewer/template.py", "qaai/viewer/template_hazard_review.py", "qaai/viewer/template_test_case.py"], "imported_by": ["qaai/api/services.py"]}, {"path": "qaai/viewer/template.py", "language": "python", "role": "Assembles the RTM viewer HTML (common + suite CSS/JS)", "explanation": "Concatenates the shared base.css/shared.js with the test_suite_reviewer style.css/script.js into the common layout.html to produce HTML_TEMPLATE with a placeholder for the data.", "python_analogy": "A module that reads sibling asset files at import time and string-concatenates them — like bundling CSS/JS by hand.", "key_snippet": {"start": 5, "end": 20, "code": "\nfrom pathlib import Path\n\n_COMMON = Path(__file__).parent / \"common\"\n_HERE   = Path(__file__).parent / \"test_suite_reviewer\"\n\n_css  = (_COMMON / \"base.css\").read_text(encoding=\"utf-8\") + (_HERE / \"style.css\").read_text(encoding=\"utf-8\")\n_js   = (_COMMON / \"shared.js\").read_text(encoding=\"utf-8\") + \"\\n\" + (_HERE / \"script.js\").read_text(encoding=\"utf-8\")\n_html = (_COMMON / \"layout.html\").read_text(encoding=\"utf-8\")\n\nHTML_TEMPLATE = (\n    _html\n    .replace(\"{{CSS}}\",          _css)\n    .replace(\"{{JS}}\",           _js)\n    .replace(\"{{HEADER_TITLE}}\", \"Test Suite Reviewer\")\n)"}, "imports": [], "imported_by": ["qaai/viewer/generator.py", "qaai/viewer/__init__.py"]}, {"path": "qaai/viewer/template_hazard_review.py", "language": "python", "role": "Assembles the hazard viewer HTML", "explanation": "Same assembly as template.py but wires the hazard_reviewer style.css/script.js into the shared layout to produce HZ_HTML_TEMPLATE.", "python_analogy": "A parallel bundler module for the hazard viewer's assets.", "key_snippet": {"start": 10, "end": 24, "code": "from pathlib import Path\n\n_COMMON = Path(__file__).parent / \"common\"\n_HERE   = Path(__file__).parent / \"hazard_reviewer\"\n\n_css  = (_COMMON / \"base.css\").read_text(encoding=\"utf-8\") + (_HERE / \"style.css\").read_text(encoding=\"utf-8\")\n_js   = (_COMMON / \"shared.js\").read_text(encoding=\"utf-8\") + \"\\n\" + (_HERE / \"script.js\").read_text(encoding=\"utf-8\")\n_html = (_COMMON / \"layout.html\").read_text(encoding=\"utf-8\")\n\nHZ_HTML_TEMPLATE = (\n    _html\n    .replace(\"{{CSS}}\",          _css)\n    .replace(\"{{JS}}\",           _js)\n    .replace(\"{{HEADER_TITLE}}\", \"Hazard Risk Reviewer Output Viewer\")\n)"}, "imports": [], "imported_by": ["qaai/viewer/generator.py", "qaai/viewer/__init__.py"]}, {"path": "qaai/viewer/template_test_case.py", "language": "python", "role": "Assembles the test-case viewer HTML", "explanation": "Same assembly wiring the test_case_reviewer assets into the shared layout to produce TC_HTML_TEMPLATE.", "python_analogy": "A parallel bundler module for the test-case viewer's assets.", "key_snippet": {"start": 10, "end": 24, "code": "from pathlib import Path\n\n_COMMON = Path(__file__).parent / \"common\"\n_HERE   = Path(__file__).parent / \"test_case_reviewer\"\n\n_css  = (_COMMON / \"base.css\").read_text(encoding=\"utf-8\") + (_HERE / \"style.css\").read_text(encoding=\"utf-8\")\n_js   = (_COMMON / \"shared.js\").read_text(encoding=\"utf-8\") + \"\\n\" + (_HERE / \"script.js\").read_text(encoding=\"utf-8\")\n_html = (_COMMON / \"layout.html\").read_text(encoding=\"utf-8\")\n\nTC_HTML_TEMPLATE = (\n    _html\n    .replace(\"{{CSS}}\",          _css)\n    .replace(\"{{JS}}\",           _js)\n    .replace(\"{{HEADER_TITLE}}\", \"Single Test Case Reviewer\")\n)"}, "imports": [], "imported_by": ["qaai/viewer/generator.py", "qaai/viewer/__init__.py"]}, {"path": "qaai/eval/__init__.py", "language": "python", "role": "Eval package public API (spec + scoring)", "explanation": "Import-light package surface: load_spec/EvalSpec and build_records/compute_metrics/RecordResult. Heavy deps (mlflow) are intentionally kept out so importing the package stays cheap.", "python_analogy": "A package __init__ that re-exports the pure scoring API without pulling in mlflow.", "key_snippet": {"start": 16, "end": 26, "code": "from qaai.eval.spec import EvalSpec, load_spec, get_path\nfrom qaai.eval.scoring import RecordResult, build_records, compute_metrics\n\n__all__ = [\n    \"EvalSpec\",\n    \"load_spec\",\n    \"get_path\",\n    \"RecordResult\",\n    \"build_records\",\n    \"compute_metrics\",\n]"}, "imports": ["qaai/eval/spec.py", "qaai/eval/scoring.py"], "imported_by": []}, {"path": "qaai/eval/spec.py", "language": "python", "
